<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>💼 Финансы</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .wallets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .wallet-card { background: var(--panel); padding: 16px; border-radius: 16px; text-align: center; border: 1px solid var(--border); }
    .wallet-name { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
    .wallet-balance { font-size: 20px; font-weight: 700; color: var(--accent); }
    .action-buttons { display: flex; gap: 8px; margin-bottom: 24px; }
    .action-buttons .btn { flex: 1; }
    .op-list { background: var(--panel); border-radius: 16px; padding: 0 16px; border: 1px solid var(--border); }
    .op-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .op-item:last-child { border-bottom: none; }
    .op-info { display: flex; flex-direction: column; }
    .op-cat { font-weight: 600; font-size: 15px; }
    .op-details { font-size: 12px; color: var(--text-dim); }
    .op-amount { font-weight: 700; font-size: 16px; }
    .op-expense { color: var(--red); }
    .op-income { color: var(--green); }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .input-row > div { flex: 1; }
    .input-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    .save-btn { width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; background: var(--green); color: white; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; }
    .cancel-btn { width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; background: var(--border); color: var(--text); border: none; font-weight: 700; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💼 Финансы</h1>
  </div>
  <div class="wallets-grid" id="walletsGrid"></div>
  
  <div class="action-buttons">
    <button class="btn btn-orange" onclick="toggleOpForm('expense')">➖ Трата</button>
    <button class="btn btn-green" onclick="toggleOpForm('income')">➕ Доход</button>
  </div>

  <div id="opFormContainer" style="display: none; margin-bottom: 20px;">
    <div style="background: var(--panel); border: 2px solid var(--accent); border-radius: 16px; padding: 16px;">
      <h3 id="opFormTitle" style="margin-bottom: 12px; font-size: 16px;">Новая операция</h3>
      <div style="margin-bottom: 10px;"><label>Сумма</label><input type="number" id="op_amount" class="form-control" placeholder="0" inputmode="decimal"></div>
      <div class="input-row">
        <div><label>Кошелёк</label><select id="op_wallet" class="form-control"></select></div>
        <div><label>Категория</label><select id="op_cat" class="form-control"></select></div>
      </div>
      <div style="margin-bottom: 10px;"><label>Заметка</label><input type="text" id="op_note" class="form-control" placeholder="Детали..."></div>
      <button class="save-btn" onclick="saveOp()">💾 СОХРАНИТЬ</button>
      <button class="cancel-btn" onclick="toggleOpForm()">Отмена</button>
    </div>
  </div>

  <h3 style="margin-bottom: 10px; font-size: 16px;">Последние операции</h3>
  <div class="op-list" id="opsList"></div>
</div>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html" class="active"><span>💼</span>Финансы</a>
    <a href="cash.html"><span>🛵</span>Скутер</a>
    <a href="settings.html"><span>⚙</span>Настройки</a>
  </div>
</nav>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/guard.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script src="js/domain/finance-api.js"></script>
<script>
  Theme.init();
  let currentOpType = 'expense';

  function render() {
    const wallets = State.getWallets();
    document.getElementById("walletsGrid").innerHTML = Object.keys(wallets).map(name => `
      <div class="wallet-card">
        <div class="wallet-name">${name}</div>
        <div class="wallet-balance">${UI.fmt(wallets[name])} лей</div>
      </div>
    `).join("");
    const ops = State.getOps().reverse().slice(0, 10);
    document.getElementById("opsList").innerHTML = ops.length ? ops.map(op => {
      let sign = op.amount < 0 ? "−" : "+";
      let cls = op.kind === "expense" ? "op-expense" : "op-income";
      let cat = op.cat || (op.kind === "transfer" ? "Перевод" : "Без категории");
      return `
        <div class="op-item">
          <div class="op-info">
            <span class="op-cat">${UI.esc(cat)}</span>
            <span class="op-details">${op.date} · ${op.wallet}${op.note ? " · " + UI.esc(op.note) : ""}</span>
          </div>
          <div class="op-amount ${cls}">${sign}${Math.abs(op.amount)}</div>
        </div>
      `;
    }).join("") : `<div style="padding: 16px; text-align: center; color: var(--text-dim);">Нет операций</div>`;
  }

  function toggleOpForm(type) {
    const container = document.getElementById("opFormContainer");
    
    // Если форма уже открыта и нажали на тот же тип — закрываем
    if (container.style.display === "block" && currentOpType === type) {
      container.style.display = "none";
      return;
    }
    
    currentOpType = type;
    container.style.display = "block";
    document.getElementById("opFormTitle").innerText = type === 'expense' ? "➖ Новая трата" : "➕ Новый доход";
    
    const wallets = Object.keys(State.getWallets());
    document.getElementById("op_wallet").innerHTML = wallets.map(w => `<option value="${w}">${w}</option>`).join("");
    
    const cats = State.getCategories()[type === 'expense' ? "expense" : "income"];
    document.getElementById("op_cat").innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join("");
    
    document.getElementById("op_amount").focus();
  }

  function saveOp() {
    if (!guardAction("saveOp")) return;
    try {
      const amount = UI.num(document.getElementById("op_amount").value);
      const wallet = document.getElementById("op_wallet").value;
      const cat = document.getElementById("op_cat").value;
      const note = document.getElementById("op_note").value.trim();
      
      if (amount <= 0) throw new Error("Введите сумму больше нуля");
      
      if (currentOpType === 'expense') {
        FinanceAPI.spend({ wallet, amount, category: cat, note });
      } else {
        FinanceAPI.receive({ wallet, amount, category: cat, note });
      }
      
      document.getElementById("opFormContainer").style.display = "none";
      render();
      Notify.show(`✅ Записано: ${amount} лей`);
    } catch (e) {
      Notify.error(e.message);
    }
  }

  render();
</script>
</body>
</html>
