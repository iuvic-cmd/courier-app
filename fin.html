<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="stylesheet" href="css/components.css">
<style>
.container{max-width:480px;margin:0 auto;padding:16px 16px 150px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
h1{font-size:28px;margin:4px 0 8px}h2{font-size:15px;margin:2px 0 8px;color:var(--text-dim);font-weight:600}
.mut{color:var(--text-dim);font-size:12px}.g{color:var(--green)}.r{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--border);cursor:pointer}
.card>.row:first-of-type,.card>h2+.row{border-top:0}.row b{white-space:nowrap}
.two{display:flex;gap:10px}.two>div{flex:1}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:14px;position:sticky;top:0;z-index:5}
.tabs div{flex:1;text-align:center;padding:9px 2px;font-size:12px;font-weight:600;border-radius:10px;cursor:pointer;color:var(--text-dim)}
.tabs div.on{background:var(--panel);color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.bt,input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px;margin:4px 0}
textarea{min-height:120px;font-size:13px}
.bt{background:var(--panel);text-align:center;cursor:pointer;font-weight:600}.bt.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
label{font-size:12px;color:var(--text-dim);display:block;margin-top:6px}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 4px 14px #0005;z-index:9}
#ov{display:none;position:fixed;inset:0;background:#0007;align-items:flex-end;z-index:50}#ov.on{display:flex}
#sh{background:var(--panel);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1;padding:9px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}.seg button.on{background:var(--accent);color:#fff}
.err{color:var(--red);font-size:14px;min-height:18px}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;display:none;z-index:60}
</style></head><body>

<script>
try{Theme.init()}catch(e){}

// Адаптер для работы со старым кодом через новые ключи
const S = {
  get kohelki() { return State.getWallets(); }, set kohelki(v) { State.setWallets(v); },
  get istorija() { return State.getOps(); }, set istorija(v) { State.setOps(v); },
  get kat_trat() { return State.getCategories().expense; }, set kat_trat(v) { let c = State.getCategories(); c.expense = v; State.setCategories(c); },
  get kat_dohodov() { return State.getCategories().income; }, set kat_dohodov(v) { let c = State.getCategories(); c.income = v; State.setCategories(c); },
  get traty() { return AppStorage.get("traty", {}); }, set traty(v) { AppStorage.set("traty", v); },
  get dohody() { return AppStorage.get("dohody", {}); }, set dohody(v) { AppStorage.set("dohody", v); },
  get byudzhety() { return AppStorage.get("byudzhety", {}); }, set byudzhety(v) { AppStorage.set("byudzhety", v); },
  get celi() { return AppStorage.get("celi", {}); }, set celi(v) { AppStorage.set("celi", v); },
  get dolgi() { return AppStorage.get("dolgi", []); }, set dolgi(v) { AppStorage.set("dolgi", v); },
  get kredity() { return AppStorage.get("kredity", []); }, set kredity(v) { AppStorage.set("kredity", v); },
  get kartki() { return AppStorage.get("kartki", []); }, set kartki(v) { AppStorage.set("kartki", v); },
  get aktivy() { return AppStorage.get("aktivy", []); }, set aktivy(v) { AppStorage.set("aktivy", v); },
  get kursy() { return AppStorage.get("kursy", {}); }, set kursy(v) { AppStorage.set("kursy", v); },
  get valyuty() { return AppStorage.get("valyuty", {}); }, set valyuty(v) { AppStorage.set("valyuty", v); },
  get regulyarnye() { return AppStorage.get("regulyarnye", []); }, set regulyarnye(v) { AppStorage.set("regulyarnye", v); },
  get lombard() { return AppStorage.get("lombard", []); }, set lombard(v) { AppStorage.set("lombard", v); },
  get lombard_info() { return AppStorage.get("lombard_info", {stavka:3,den:25,koshel:"Наличные",proc_ym:"",proc_sum:0}); }, set lombard_info(v) { AppStorage.set("lombard_info", v); }
};

let tab="home",q="",lim=40,RP="m",MF=null,MM=[];
const $=id=>document.getElementById(id);
const esc=UI.esc;
const SY={MDL:"лей",USD:"$",EUR:"€"};
const cur=w=>S.valyuty[w]||"MDL",sym=w=>SY[cur(w)]||cur(w),kurs=c=>c==="MDL"?1:(+S.kursy[c]||0);
const fmt=UI.fmt, r2=UI.r2, num=UI.num;
const pos=x=>{x=r2(num(x));if(!(x>0))throw"Сумма должна быть больше нуля";return x};
const nowS=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())};
const ops=()=>S.istorija.filter(z=>z&&typeof z==="object");
const nid=()=>Math.max(0,...ops().map(z=>z.id||0))+1;
const mid=a=>Math.max(0,...a.map(x=>x.id||0))+1;
const opt=(a,s)=>a.map(x=>`<option${x===s?" selected":""}>${esc(x)}</option>`).join("");
const W=()=>Object.keys(S.kohelki),WM=()=>W().filter(w=>cur(w)==="MDL");
function toast(t){Notify.show(t)}
const err=e=>Notify.error(typeof e==="string"?e:e.message);

// Хранение теперь через AppStorage, так что init/save не нужны, они уже есть в state.js

// --- Логика ---
function rec(tip,s,w,o){
  const z=Object.assign({id:nid(),data:nowS(),tip,summa:s,koshel:w},o);
  if(w&&cur(w)!=="MDL"&&["Трата","Доход","Корректировка"].includes(tip))z.baz=r2(s*kurs(cur(w)));
  Object.keys(z).forEach(k=>{if(z[k]===""||z[k]==null)delete z[k]});
  S.istorija.push(z); AppStorage.set("ops", S.istorija);
}

function addOp(tip,w,kat,s,note){
  s=r2(s);if(!(s>0))throw"Сумма должна быть больше нуля";kat=(kat||"").trim();if(!kat)throw"Выбери категорию";
  if(tip==="Трата"){
    if(S.kohelki[w]<s)throw`Недостаточно средств: на «${w}» только ${fmt(S.kohelki[w])}`;
    S.kohelki[w]=r2(S.kohelki[w]-s);
    let tr=S.traty; tr[kat]=r2((tr[kat]||0)+s); S.traty=tr;
    if(!S.kat_trat.includes(kat)) { let c=State.getCategories(); c.expense.push(kat); State.setCategories(c); }
  } else {
    S.kohelki[w]=r2(S.kohelki[w]+s);
    let dh=S.dohody; dh[kat]=r2((dh[kat]||0)+s); S.dohody=dh;
    if(!S.kat_dohodov.includes(kat)) { let c=State.getCategories(); c.income.push(kat); State.setCategories(c); }
  }
  rec(tip,s,w,{kat,zametka:note});
}

function transfer(a,b,s,t,note){ /* ... */ }

function undo(id){
  const z=ops().find(x=>x.id===id);if(!z)return;
  try{
    const t=z.tip,w=z.koshel,s=z.summa;
    if(!["Трата","Доход","Перевод","Корректировка"].includes(t))throw"Эту операцию нельзя отменить здесь";
    if(!(w in S.kohelki)||(t==="Перевод"&&!(z.kuda in S.kohelki)))throw"Кошелёк из этой операции удалён";
    if(t==="Трата"){S.kohelki[w]=r2(S.kohelki[w]+s);let tr=S.traty;tr[z.kat]=Math.max(0,r2((tr[z.kat]||0)-s));S.traty=tr}
    else if(t==="Доход"){if(S.kohelki[w]<s)throw"На кошельке уже меньше этой суммы";S.kohelki[w]=r2(S.kohelki[w]-s);let dh=S.dohody;dh[z.kat]=Math.max(0,r2((dh[z.kat]||0)-s));S.dohody=dh}
    else if(t==="Корректировка"){if(S.kohelki[w]-s<0)throw"Баланс станет отрицательным";S.kohelki[w]=r2(S.kohelki[w]-s)}
    else{if(S.kohelki[z.kuda]<s)throw"На кошельке назначения уже меньше";S.kohelki[z.kuda]=r2(S.kohelki[z.kuda]-s);S.kohelki[w]=r2(S.kohelki[w]+s)}
    S.istorija.splice(S.istorija.indexOf(z),1);AppStorage.set("ops",S.istorija);render();toast("Операция отменена")
  }catch(e){err(e)}
}

// --- Окна ---
function closeSheet(){$("ov").classList.remove("on")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeSheet()});
function ask(t,yes){$("sh").innerHTML=`<p>${esc(t)}</p><button class="bt pri" id="yes">Да</button><button class="bt" onclick="closeSheet()">Нет</button>`;$("ov").classList.add("on");$("yes").onclick=()=>{closeSheet();yes()}}
function mm(t,it){$("sh").innerHTML=`<h2>${t}</h2>`+it.map((x,i)=>`<button class="bt${i?"":" pri"}" onclick="MM[${i}]()">${x[0]}</button>`).join("")+`<button class="bt" onclick="closeSheet()">Закрыть</button>`;MM=it.map(x=>x[1]);$("ov").classList.add("on")}
function mini(t,fs,ok,hint){MF={fs,ok};$("sh").innerHTML=`<h2>${t}</h2>${hint?`<div class="mut">${hint}</div>`:""}`+fs.map(f=>f[2]?`<label>${f[1]}</label><select id="m_${f[0]}">${opt(f[2],f[3])}</select>`:`<input id="m_${f[0]}" placeholder="${f[1]}" value="${esc(f[3]??"")}"${f[4]?' inputmode="decimal"':""}>`).join("")+`<div class="err" id="m_e"></div><button class="bt pri" onclick="miniOk()">Готово</button><button class="bt" onclick="closeSheet()">Отмена</button>`;$("ov").classList.add("on")}
function miniOk(){const v={};MF.fs.forEach(f=>v[f[0]]=$("m_"+f[0]).value.trim());try{MF.ok(v);closeSheet();render();toast("Сохранено")}catch(e){$("m_e").textContent=typeof e==="string"?e:e.message}}

// --- Форма быстрой операции ---
function sheet(tip){
  const old=$("f_s")?$("f_s").value:"",w=W();
  let h=`<div class="seg">${["Трата","Доход","Перевод"].map(t=>`<button class="${t===tip?"on":""}" onclick="sheet('${t}')">${t}</button>`).join("")}</div><input id="f_s" inputmode="decimal" placeholder="Сумма" value="${esc(old)}">`;
  if(tip==="Перевод")h+=`<label>Откуда</label><select id="f_a" onchange="cv()">${opt(w)}</select><label>Куда</label><select id="f_b" onchange="cv()">${opt(w.concat(S.kartki.map(c=>"💳 "+c.nazvanie)),w[1])}</select><input id="f_c" inputmode="decimal" placeholder="Сумма к зачислению" style="display:none">`;
  else h+=`<label>Кошелёк</label><select id="f_w">${opt(w)}</select><label>Категория</label><select id="f_k">${opt(tip==="Трата"?S.kat_trat:S.kat_dohodov)}</select>`;
  h+=`<input id="f_n" placeholder="Заметка (необязательно)"><div class="err" id="f_e"></div><button class="bt pri" onclick="submit('${tip}')">Сохранить</button><button class="bt" onclick="closeSheet()">Отмена</button>`;
  $("sh").innerHTML=h;$("ov").classList.add("on");if(tip==="Перевод")cv()}
function cv(){const a=$("f_a").value,b=$("f_b").value,c=$("f_c");if(cur(a)===cur(b)){c.style.display="none";return}
  c.style.display="block";const s=num($("f_s").value),ka=kurs(cur(a)),kb=kurs(cur(b));if(s>0&&ka&&kb&&!c.value)c.value=r2(s*ka/kb)}
function submit(tip){
  try{const s=num($("f_s").value),n=$("f_n").value.trim();
    if(tip==="Перевод")transfer($("f_a").value,$("f_b").value,s,num($("f_c").value),n);
    else addOp(tip,$("f_w").value,$("f_k").value,s,n);
    closeSheet();render();toast("Сохранено")
  }catch(e){$("f_e").textContent=typeof e==="string"?e:e.message}}

// --- Операции ---
function row(z){
  const ic={"Трата":"➖","Доход":"➕","Перевод":"🔄","Конвертация":"🔄","Кредитка":"💳","Долг":"🤝","Кредит":"🏛","Ломбард":"🥇","Цель":"🎯"}[z.tip]||"•";
  const kp=z.tip==="Кредитка"&&(z.napr==="покупка"||z.napr==="проценты"),neg=z.tip==="Трата"||kp;
  const sg=neg?"-":z.tip==="Доход"?"+":"",c=neg?"r":z.tip==="Доход"?"g":"",w=z.koshel||"",ttl=z.kat||(z.kuda?w+" → "+z.kuda:z.tip);
  return `<div class="row" onclick="opMenu(${z.id})"><div>${ic} ${esc(ttl)}<div class="mut">${esc((z.data||"").slice(0,16))} · ${esc(w)}${z.zametka?" · "+esc(z.zametka):""}</div></div><b class="${c}">${sg}${fmt(z.summa)} ${esc(SY[cur(w)]||"")}</b></div>`}
function opMenu(id){const z=ops().find(x=>x.id===id),it=[];if(!z)return;
  if(z.tip==="Трата"||z.tip==="Доход")it.push(["✏️ Изменить",()=>editOp(id)]);
  if(["Трата","Доход","Перевод","Корректировка"].includes(z.tip))it.push(["↩️ Отменить операцию",()=>ask("Отменить эту операцию?",()=>undo(id))]);
  if(it.length)mm(esc(z.tip)+" · "+fmt(z.summa),it)}
function editOp(id){const z=ops().find(x=>x.id===id),L=z.tip==="Трата"?S.kat_trat:S.kat_dohodov;
  mini("Изменить",[["k","Категория",L.includes(z.kat)?L:L.concat(z.kat),z.kat],["s","Сумма",null,z.summa,1],["w","Кошелёк",W(),z.koshel],["n","Заметка",null,z.zametka||""]],v=>{
    const s=pos(v.s),sg=z.tip==="Трата"?-1:1,B=Object.assign({},S.kohelki);B[z.koshel]=r2(B[z.koshel]-sg*z.summa);B[v.w]=r2(B[v.w]+sg*s);
    if(B[z.koshel]<0||B[v.w]<0)throw"Не хватит денег на кошельке";S.kohelki=B;
    Object.assign(z,{kat:v.k,summa:s,koshel:v.w,zametka:v.n});if(!z.zametka)delete z.zametka;delete z.baz;if(cur(v.w)!=="MDL")z.baz=r2(s*kurs(cur(v.w)));
    AppStorage.set("ops",S.istorija)})}

// --- Вкладки ---
const TABS=[["home","💰 Кошельки"],["hist","🕘 История"],["goal","🎯 Цели"],["debt","🤝 Долги"],["more","⚙️ Ещё"]];
function nav(){const on=["bud","reg","cat","rep","cred","cards","asset"].includes(tab)?"more":tab;return `<div class="tabs">${TABS.map(([k,l])=>`<div class="${on===k?"on":""}" onclick="go('${k}')">${l}</div>`).join("")}</div>`}
function go(t){tab=t;render()}
const back=t=>`<button class="bt" onclick="go('more')">← Назад</button><h2>${t}</h2>`;

function home(){
  const ws=W(),tot=ws.reduce((a,w)=>a+S.kohelki[w]*kurs(cur(w)),0),ym=nowS().slice(0,7);let sp=0,inc=0;
  ops().forEach(z=>{if((z.data||"").startsWith(ym)){const v=z.baz??z.summa;if(z.tip==="Трата"||(z.tip==="Кредитка"&&(z.napr==="покупка"||z.napr==="проценты")))sp+=v;if(z.tip==="Доход")inc+=v}});
  const cs=[...new Set(ws.map(cur).concat(Object.keys(S.kursy)))].filter(c=>c!=="MDL");
  return `<div class="card"><div class="mut">Всего в кошельках</div><h1>${fmt(tot)} лей</h1><div class="two"><div><div class="mut">Доходы за месяц</div><b class="g">+${fmt(inc)}</b></div><div><div class="mut">Траты за месяц</div><b class="r">-${fmt(sp)}</b></div></div></div>
  <div class="card"><h2>Кошельки</h2>${ws.map((w,i)=>`<div class="row" onclick="walMenu(${i})"><span>✎ ${esc(w)} <span class="mut">${esc(cur(w))}</span></span><b>${fmt(S.kohelki[w])} ${esc(sym(w))}</b></div>`).join("")}${S.kartki.length?`<div class="mut" style="margin:12px 0 2px">💳 Кредитные карты · не входят в общий итог</div>`+S.kartki.map(c=>{const bl=r2(c.limit-c.dolg);return `<div class="row" onclick="go('cards')"><span>💳 ${esc(c.nazvanie)} <span class="mut">долг ${fmt(c.dolg)}</span></span><b class="${bl<0?"r":""}">${bl<0?"−":""}${fmt(Math.abs(bl))} лей</b></div>`}).join(""):""}</div>
  ${cs.length?`<div class="card"><h2>Курсы к лею</h2>${cs.map(c=>`<label>1 ${esc(c)} =</label><input inputmode="decimal" value="${S.kursy[c]||""}" onchange="setRate('${esc(c)}',this.value)">`).join("")}</div>`:""}
  <div class="card"><h2>Новый кошелёк</h2><input id="nw" placeholder="Название"><select id="nc"><option>MDL</option><option>USD</option><option>EUR</option></select><input id="nr" inputmode="decimal" placeholder="Курс к лею (для USD/EUR)"><button class="bt pri" onclick="addW()">Добавить</button></div>
  <div class="card"><h2>Последние операции</h2>${ops().slice(-5).reverse().map(row).join("")||'<div class="mut">Пока нет операций</div>'}</div>`}
function setRate(c,v){const x=num(v);if(x>0){S.kursy[c]=x;AppStorage.set("kursy",S.kursy);render();toast("Курс сохранён")}}
function addW(){const n=$("nw").value.trim(),c=$("nc").value,r=num($("nr").value);
  if(!n)return toast("Введи название");if(n in S.kohelki)return toast("Такой кошелёк уже есть");
  if(c!=="MDL"&&!(r>0)&&!(S.kursy[c]>0))return toast("Укажи курс");
  S.kohelki[n]=0;if(c!=="MDL"){S.valyuty[n]=c;if(r>0)S.kursy[c]=r}AppStorage.set("valyuty",S.valyuty);AppStorage.set("kursy",S.kursy);render();toast("Кошелёк добавлен")}
function walMenu(i){const w=W()[i];mm(`${esc(w)}: ${fmt(S.kohelki[w])} ${esc(sym(w))}`,[["⚖️ Корректировка баланса",()=>corr(i)],["✏️ Переименовать",()=>ren(i)],["🗑 Удалить",()=>delW(i)]])}
function corr(i){const w=W()[i];mini("Корректировка: "+esc(w),[["r","Реальный остаток ("+sym(w)+")",null,S.kohelki[w],1],["n","Заметка"]],v=>{
  const r=r2(num(v.r));if(!isFinite(r)||r<0)throw"Остаток не может быть отрицательным";const d=r2(r-S.kohelki[w]);if(!d)throw"Уже совпадает";S.kohelki[w]=r;rec("Корректировка",d,w,{zametka:v.n})},"Сейчас в учёте: "+fmt(S.kohelki[w]))}
function ren(i){const w=W()[i];mini("Переименовать",[["n","Название",null,w]],v=>{
  const n=v.n.replace(/\s+/g," ");if(!n)throw"Пустое название";if(n!==w&&n in S.kohelki)throw"Такой кошелёк уже есть";
  const o={};W().forEach(k=>o[k===w?n:k]=S.kohelki[k]);S.kohelki=o;
  ops().forEach(z=>{if(z.koshel===w)z.koshel=n;if(z.kuda===w)z.kuda=n});
  if(S.valyuty[w]){S.valyuty[n]=S.valyuty[w];delete S.valyuty[w]}

function payK(id){const k=S.kredity.find(x=>x.id===id);

function payL(){const ym=nowS().slice(0,7),I=S.lombard_info,LO=()=>S.lombard.filter(b=>b.ostatok>0.005),
  pm=r2(LO().reduce((a,b)=>a+b.summa,0)*I.stavka/100),due=Math.max(0,r2(pm-(I.proc_ym===ym?I.proc_sum:0))),tot=r2(LO().reduce((a,b)=>a+b.ostatok,0));

function chA(i){const a=S.aktivy[i];
  mini(a?"Изменить оценку":"Новый актив",(a?[]:[["n","Название"]]).concat([["s",a?"Новая оценка (0 — удалить)":"Оценка в леях",null,a?a.ocenka:"",1]]),v=>{
    if(a){const x=r2(num(v.s));if(x===0)S.aktivy.splice(i,1);else if(x>0)a.ocenka=x;else throw"Некорректная сумма"}
    else{if(!v.n)throw"Укажи название";S.aktivy.push({id:mid(S.aktivy),nazvanie:v.n,ocenka:pos(v.s)})}AppStorage.set("aktivy",S.aktivy)})}

/* --- Кредитные карты --- */
const cdue=c=>{const d=new Date(),dm=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return c.dolg>0&&c.den>0&&c.posl!==nowS().slice(0,7)&&d.getDate()>=Math.max(1,Math.min(c.den,dm)-5)};
function cards(){
  const tl=S.kartki.reduce((a,c)=>a+c.limit,0),td=S.kartki.reduce((a,c)=>a+c.dolg,0),bal=r2(tl-td);
  return back("Кредитные карты")+`<div class="card"><div class="mut">Баланс по картам</div><h1 class="${bal<0?"r":""}">${bal<0?"−":""}${fmt(Math.abs(bal))} лей</h1><div class="mut">Долг ${fmt(td)} · лимит ${fmt(tl)}</div></div>`+
  S.kartki.map(c=>{const p=Math.min(100,Math.round(c.dolg/c.limit*100)),bl=r2(c.limit-c.dolg);
    return `<div class="card"><div class="row" style="border-top:0;padding-top:0;cursor:default"><b style="white-space:normal">💳 ${esc(c.nazvanie)}</b><span class="mut">${Math.round(c.dolg/c.limit*100)}%</span></div>
    <div class="bar"><i style="width:${p}%;background:${p>=90?"var(--red)":p>=70?"#e0a43a":"var(--green)"}"></i></div>
    <div class="two" style="margin-top:8px"><div><div class="mut">Баланс</div><b class="${bl<0?"r":"g"}">${bl<0?"−":""}${fmt(Math.abs(bl))}</b></div><div><div class="mut">Долг</div><b class="${c.dolg>0?"r":""}">${fmt(c.dolg)}</b></div><div><div class="mut">Лимит</div><b>${fmt(c.limit)}</b></div></div>
    <div class="mut" style="margin-top:8px">${c.dolg>c.limit?"⚠ сверх лимита на "+fmt(r2(c.dolg-c.limit))+" · ":""}${c.stavka?c.stavka+"% годовых":"ставка не указана"}${c.den?" · платёж до "+c.den+"-го":""}${c.min?" · мин. "+fmt(c.min):""}${c.posl===nowS().slice(0,7)?" · ✅ оплачено":""}${cdue(c)?" · 🔔 пора платить":""}</div>
    <div class="two"><div><button class="bt pri" onclick="cardBuy(${c.id})">🛍 Покупка</button></div><div><button class="bt" onclick="cardPay(${c.id})">💰 Платёж</button></div></div>
    <button class="bt" onclick="cardMenu(${c.id})">⚙ Ещё</button></div>`}).join("")+`<button class="bt pri" onclick="cardNew()">Добавить карту</button>`}
function cardNew(){mini("Новая кредитная карта",[["n","Название"],["l","Лимит",null,"",1],["d","Долг банку",null,"0",1],["r","Ставка, % годовых",null,"",1],["y","День платежа (1-31)",null,"",1],["m","Мин. платёж в месяц",null,"",1]],v=>{
  const l=pos(v.l),d=Math.abs(r2(num(v.d||0))),r=num(v.r||0)||0,y=Math.round(num(v.y||0))||0,m=r2(num(v.m||0))||0;
  if(!v.n)throw"Укажи название";if(S.kartki.some(c=>c.nazvanie===v.n))throw"Такая карта уже есть";if(y<0||y>31)throw"День от 1 до 31";
  S.kartki.push({id:mid(S.kartki),nazvanie:v.n,limit:l,dolg:d,stavka:r,den:y,min:m,posl:""});AppStorage.set("kartki",S.kartki)})}
function cardBuy(id){const c=S.kartki.find(x=>x.id===id);
  mini("Покупка: "+esc(c.nazvanie),[["k","Категория",S.kat_trat],["s","Сумма",null,"",1],["n","Заметка"]],v=>{
    const s=pos(v.s),av=r2(c.limit-c.dolg);if(s>av)throw"Превышен лимит. Доступно: "+fmt(Math.max(0,av));
    c.dolg=r2(c.dolg+s);S.traty[v.k]=r2((S.traty[v.k]||0)+s);AppStorage.set("kartki",S.kartki);rec("Кредитка",s,c.nazvanie,{kat:v.k,napr:"покупка",cid:c.id,zametka:v.n})},"Доступно: "+fmt(Math.max(0,r2(c.limit-c.dolg))))}
function cardPay(id){const c=S.kartki.find(x=>x.id===id),ws=WM();if(!ws.length)return toast("Нет кошелька в леях");
  mini("Платёж по карте: "+esc(c.nazvanie),[["w","Откуда платим",ws],["s","Сумма (долг "+fmt(c.dolg)+")",null,c.min&&c.min<=c.dolg?c.min:c.dolg,1]],v=>{
    const s=pos(v.s);if(s>c.dolg)throw"Больше текущего долга";if(S.kohelki[v.w]<s)throw"Недостаточно средств на «"+v.w+"»";
    const pp=c.posl;S.kohelki[v.w]=r2(S.kohelki[v.w]-s);c.dolg=r2(c.dolg-s);if(!c.min||s>=c.min||c.dolg<=0)c.posl=nowS().slice(0,7);
    AppStorage.set("kartki",S.kartki);rec("Кредитка",s,v.w,{kat:c.nazvanie,napr:"платёж",cid:c.id,pp})})}
function cardFee(id){const c=S.kartki.find(x=>x.id===id);
  mini("Проценты / комиссия: "+esc(c.nazvanie),[["s","Сумма (увеличит долг)",null,"",1],["n","Заметка"]],v=>{const s=pos(v.s);c.dolg=r2(c.dolg+s);AppStorage.set("kartki",S.kartki);rec("Кредитка",s,c.nazvanie,{kat:c.nazvanie,napr:"проценты",cid:c.id,zametka:v.n})})}
function cardCash(id){const c=S.kartki.find(x=>x.id===id);
  mini("Снять наличные: "+esc(c.nazvanie),[["w","Зачислить на",WM()],["s","Сумма",null,"",1]],v=>{
    const s=pos(v.s),av=r2(c.limit-c.dolg);if(s>av)throw"Превышен лимит. Доступно: "+fmt(Math.max(0,av));
    c.dolg=r2(c.dolg+s);S.kohelki[v.w]=r2(S.kohelki[v.w]+s);AppStorage.set("kartki",S.kartki);rec("Кредитка",s,v.w,{kat:c.nazvanie,napr:"снятие",cid:c.id})})}
function cardEdit(id){const c=S.kartki.find(x=>x.id===id);
  mini("Изменить карту",[["n","Название",null,c.nazvanie],["l","Лимит",null,c.limit,1],["d","Долг по выписке",null,c.dolg,1],["r","Ставка, %",null,c.stavka||"",1],["y","День (1-31)",null,c.den||"",1],["m","Мин. платёж",null,c.min||"",1]],v=>{
    const l=pos(v.l),d=Math.abs(r2(num(v.d||0))),r=num(v.r||0)||0,y=Math.round(num(v.y||0))||0,m=r2(num(v.m||0))||0;
    if(!v.n)throw"Укажи название";if(v.n!==c.nazvanie&&S.kartki.some(x=>x.nazvanie===v.n))throw"Такая карта уже есть";if(y<0||y>31)throw"День от 1 до 31";
    const df=r2(d-c.dolg);Object.assign(c,{nazvanie:v.n,limit:l,stavka:r,den:y,min:m});
    if(df){c.dolg=d;rec("Кредитка",Math.abs(df),c.nazvanie,{kat:c.nazvanie,napr:"корректировка",cid:c.id,d:df})}AppStorage.set("kartki",S.kartki)})}
function cardMenu(id){const c=S.kartki.find(x=>x.id===id);
  mm(esc(c.nazvanie),[["📈 Проценты / комиссия",()=>cardFee(id)],["💵 Снять наличные",()=>cardCash(id)],["✏️ Изменить параметры",()=>cardEdit(id)],["🗑 Удалить карту",()=>{if(c.dolg>0)return toast("Сначала погаси долг");ask("Удалить карту «"+c.nazvanie+"»?",()=>{S.kartki.splice(S.kartki.indexOf(c),1);AppStorage.set("kartki",S.kartki);render()})}]])}

/* --- Рендер --- */
function render(keep){
  const map={home,hist,goal,debt,more,bud,reg,cat,rep,cred,cards,asset};
  const f=keep&&document.activeElement&&document.activeElement.tagName==="INPUT";
  $("app").innerHTML=nav()+(map[tab]||home)();
  if(f){const i=$("app").querySelector("input");if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
render();
</script>
</body></html>
