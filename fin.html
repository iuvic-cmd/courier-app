<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>💼 Финансы</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    h1 { font-size: 28px; margin: 4px 0 8px; }
    h2 { font-size: 15px; margin: 2px 0 8px; color: var(--text-dim); font-weight: 600; }
    .mut { color: var(--text-dim); font-size: 12px; }
    .g { color: var(--green); } .r { color: var(--red); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
    .card > .row:first-of-type, .card > h2 + .row { border-top: 0; }
    .row b { white-space: nowrap; }
    
    .tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 14px; position: sticky; top: 0; z-index: 5; overflow-x: auto; }
    .tabs div { flex: 1; text-align: center; padding: 9px 2px; font-size: 12px; font-weight: 600; border-radius: 10px; cursor: pointer; color: var(--text-dim); white-space: nowrap; }
    .tabs div.on { background: var(--panel); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    
    .bt, input, select { width: 100%; font: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin: 4px 0; }
    .bt { background: var(--panel); text-align: center; cursor: pointer; font-weight: 600; }
    .bt.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
    label { font-size: 12px; color: var(--text-dim); display: block; margin-top: 6px; }
    
    .fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom,0px)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 30px; box-shadow: 0 4px 14px #0005; z-index: 9; }
    
    #ov { display: none; position: fixed; inset: 0; background: #0007; align-items: flex-end; z-index: 50; }
    #ov.on { display: flex; }
    #sh { background: var(--panel); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom,0px)); max-height: 90%; overflow: auto; }
    
    .seg { display: flex; gap: 6px; margin-bottom: 8px; }
    .seg button { flex: 1; padding: 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
    .seg button.on { background: var(--accent); color: #fff; }
    .err { color: var(--red); font-size: 14px; min-height: 18px; }
    
    .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar i { display: block; height: 100%; background: var(--green); }
    
    .menu-btn { display: block; width: 100%; text-align: left; padding: 14px; font-size: 16px; background: var(--panel); border: none; border-bottom: 1px solid var(--border); color: var(--text); cursor: pointer; font-weight: 500;}
    .menu-btn:last-child { border-bottom: none; border-radius: 0 0 16px 16px; }
    .menu-btn:first-child { border-radius: 16px 16px 0 0; }
  </style>
</head>
<body>
<div class="container" id="app"></div>
<button class="fab" onclick="sheet('Трата')">＋</button>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html" class="active"><span>💼</span>Финансы</a>
    <a href="cash.html"><span>🛵</span>Скутер</a>
    <a href="stats.html"><span>📈</span>Отчёты</a>
    <a href="settings.html"><span>⚙</span>Настройки</a>
  </div>
</nav>

<div id="ov"><div id="sh"></div></div>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/guard.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script src="js/domain/finance-api.js"></script>
<script>
  Theme.init();
  const $ = id => document.getElementById(id);
  const esc = UI.esc;
  const fmt = UI.fmt;
  const r2 = UI.r2;
  const num = UI.num;
  const pos = x => { x = r2(num(x)); if (!(x > 0)) throw "Сумма должна быть больше нуля"; return x; };
  const nowS = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); };
  const opt = (a, s) => a.map(x => `<option${x === s ? " selected" : ""}>${esc(x)}</option>`).join("");
  const W = () => Object.keys(State.getWallets());
  
  let tab = "home", MF = null, MM = [];

  function toast(t) { Notify.show(t); }
  function closeSheet() { $("ov").classList.remove("on"); }
  $("ov").addEventListener("click", e => { if (e.target.id === "ov") closeSheet(); });
  function mm(t, it) { $("sh").innerHTML = `<h2>${t}</h2>` + it.map((x,i) => `<button class="bt${i?"":" pri"}" onclick="MM[${i}]()">${x[0]}</button>`).join("") + `<button class="bt" onclick="closeSheet()">Закрыть</button>`; MM = it.map(x => x[1]); $("ov").classList.add("on"); }
  function mini(t, fs, ok) { MF = { fs, ok }; $("sh").innerHTML = `<h2>${t}</h2>` + fs.map(f => f[2] ? `<label>${f[1]}</label><select id="m_${f[0]}">${opt(f[2], f[3])}</select>` : `<input id="m_${f[0]}" placeholder="${f[1]}" value="${esc(f[3]??"")}"${f[4]?' inputmode="decimal"':""}>`).join("") + `<div class="err" id="m_e"></div><button class="bt pri" onclick="miniOk()">Готово</button><button class="bt" onclick="closeSheet()">Отмена</button>`; $("ov").classList.add("on"); }
  function miniOk() { const v = {}; MF.fs.forEach(f => v[f[0]] = $("m_" + f[0]).value.trim()); try { MF.ok(v); closeSheet(); render(); toast("Сохранено"); } catch (e) { $("m_e").textContent = typeof e === "string" ? e : e.message; } }

  // --- Быстрая операция ---
  function sheet(tip) {
    const w = W();
    let h = `<div class="seg">${["Трата","Доход"].map(t => `<button class="${t===tip?"on":""}" onclick="sheet('${t}')">${t}</button>`).join("")}</div>`;
    h += `<input id="f_s" inputmode="decimal" placeholder="Сумма">
          <label>Кошелёк</label><select id="f_w">${opt(w)}</select>
          <label>Категория</label><select id="f_k">${opt(tip==="Трата"?State.getCategories().expense:State.getCategories().income)}</select>
          <input id="f_n" placeholder="Заметка">
          <div class="err" id="f_e"></div>
          <button class="bt pri" onclick="submit('${tip}')">Сохранить</button>
          <button class="bt" onclick="closeSheet()">Отмена</button>`;
    $("sh").innerHTML = h; $("ov").classList.add("on");
  }

  function submit(tip) {
    try {
      const s = num($("f_s").value), n = $("f_n").value.trim();
      if (s <= 0) throw "Введите сумму";
      const w = $("f_w").value, cat = $("f_k").value;
      if (tip === "Трата") FinanceAPI.spend({ wallet: w, amount: s, category: cat, note: n });
      else FinanceAPI.receive({ wallet: w, amount: s, category: cat, note: n });
      closeSheet(); render(); toast("Сохранено");
    } catch (e) { $("f_e").textContent = e.message || e; }
  }

  // ================= 1. КОШЕЛЬКИ =================
  function renderHome() {
    const wallets = State.getWallets();
    const ops = State.getOps().slice().reverse().slice(0, 5);
    return `<div class="card"><h2>Кошельки</h2>${Object.keys(wallets).map(w => `<div class="row" style="cursor:default"><span>${esc(w)}</span><b>${fmt(wallets[w])} лей</b></div>`).join("")}</div>
    <div class="card"><h2>Последние операции</h2>${ops.length ? ops.map(o => `
      <div class="row" style="cursor:default">
        <div>${o.kind === 'expense' ? '➖' : '➕'} ${esc(o.cat)}<div class="mut">${o.date}</div></div>
        <b class="${o.kind === 'expense' ? 'r' : 'g'}">${o.amount > 0 ? '+' : ''}${fmt(o.amount)}</b>
      </div>
    `).join("") : '<div class="mut">Нет операций</div>'}</div>`;
  }

  // ================= 2. ЦЕЛИ =================
  function renderGoals() {
    const goals = State.getGoals();
    let html = `<div class="card"><h2>🎯 Мои цели</h2>`;
    if (goals.length) {
      html += goals.map((g, i) => {
        const percent = g.target > 0 ? Math.min(100, Math.round(g.saved / g.target * 100)) : 0;
        return `<div class="row" style="display:block" onclick="goalMenu(${i})">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <b>${esc(g.name)}</b><span>${fmt(g.saved)} / ${fmt(g.target)}</span>
          </div>
          <div class="bar"><i style="width:${percent}%"></i></div>
        </div>`;
      }).join("");
    } else { html += `<div class="mut">Пока нет целей</div>`; }
    html += `</div><button class="bt pri" onclick="newGoal()">➕ Новая цель</button>`;
    return html;
  }
  function newGoal() { mini("Новая цель", [["n","Название"],["s","Сумма",null,"",1]], v => { if (!v.n) throw "Введите название"; const goals = State.getGoals(); goals.push({ id: Date.now().toString(), name: v.n, target: pos(v.s), saved: 0 }); State.setGoals(goals); }); }
  function goalMenu(i) { const goals = State.getGoals(), g = goals[i]; mm(esc(g.name), [["➕ Пополнить", () => addToGoal(i)], ["🗑 Удалить", () => { if(g.saved>0) return toast("Сначала снимите деньги"); goals.splice(i, 1); State.setGoals(goals); render(); }]]); }
  function addToGoal(i) { const goals = State.getGoals(), g = goals[i]; mini("Пополнить", [["w","Кошелёк",W()],["s","Сумма",null,"",1]], v => { const s = pos(v.s); FinanceAPI.spend({ wallet: v.w, amount: s, category: "Цель", note: g.name }); g.saved += s; State.setGoals(goals); }); }

  // ================= 3. ДОЛГИ =================
  function renderDebts() {
    const debts = State.getDebts();
    let html = `<div class="card"><h2>🤝 Долги</h2>`;
    if (debts.length) {
      html += debts.map(d => `<div class="row" onclick="debtMenu('${d.id}')"><div>${d.type === 'i_owe' ? '🔴' : '🟢'} ${esc(d.name)}<div class="mut">${d.type === 'i_owe' ? 'Я должен' : 'Мне должны'}</div></div><b>${fmt(d.amount)} лей</b></div>`).join("");
    } else { html += `<div class="mut">Нет активных долгов</div>`; }
    html += `</div><button class="bt pri" onclick="newDebt()">➕ Новый долг</button>`;
    return html;
  }
  function newDebt() { mini("Новый долг", [["t","Тип",["Я должен","Мне должны"]],["n","Кому/Кто"],["s","Сумма",null,"",1]], v => { if (!v.n) throw "Введите имя"; const debts = State.getDebts(); debts.push({ id: Date.now().toString(), type: v.t === "Я должен" ? "i_owe" : "owe_me", name: v.n, amount: pos(v.s) }); State.setDebts(debts); }); }
  function debtMenu(id) { const debts = State.getDebts(), d = debts.find(x => x.id === id); mm(esc(d.name), [["✅ Погасить", () => payDebt(id)], ["🗑 Удалить", () => { State.setDebts(debts.filter(x => x.id !== id)); render(); }]]); }
  function payDebt(id) { const debts = State.getDebts(), d = debts.find(x => x.id === id); mini("Погашение", [["w","Кошелёк",W()],["s","Сумма",null,d.amount,1]], v => { const s = pos(v.s); if (s > d.amount) throw "Больше остатка долга"; if (d.type === 'i_owe') FinanceAPI.spend({ wallet: v.w, amount: s, category: "Долг", note: "Погашение" }); else FinanceAPI.receive({ wallet: v.w, amount: s, category: "Долг", note: "Возврат" }); d.amount -= s; State.setDebts(d.amount <= 0 ? debts.filter(x => x.id !== id) : debts); }); }

  // ================= 4. БЮДЖЕТЫ =================
  function renderBudgets() {
    const budgets = AppStorage.get("budgets", {});
    const ym = nowS().slice(0,7);
    let html = `<div class="card"><h2>📊 Бюджеты на месяц</h2>`;
    const keys = Object.keys(budgets);
    if (keys.length) {
      html += keys.map(cat => {
        const limit = budgets[cat];
        const spent = State.getOps().filter(o => o.kind === 'expense' && o.cat === cat && o.date.startsWith(ym)).reduce((s,o) => s + Math.abs(o.amount), 0);
        const percent = limit > 0 ? Math.min(100, Math.round(spent/limit*100)) : 0;
        const color = percent >= 100 ? 'var(--red)' : percent >= 80 ? 'var(--orange)' : 'var(--green)';
        return `<div class="row" style="display:block;cursor:default">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px"><b>${esc(cat)}</b><span>${fmt(spent)} / ${fmt(limit)}</span></div>
          <div class="bar"><i style="width:${percent}%;background:${color}"></i></div>
        </div>`;
      }).join("");
    } else { html += `<div class="mut">Лимитов нет</div>`; }
    html += `</div><button class="bt pri" onclick="newBudget()">➕ Установить лимит</button>`;
    return html;
  }
  function newBudget() {
    mini("Лимит на месяц", [["c","Категория",State.getCategories().expense],["s","Лимит",null,"",1]], v => {
      const budgets = AppStorage.get("budgets", {});
      budgets[v.c] = pos(v.s); AppStorage.set("budgets", budgets);
    });
  }

  // ================= 5. КРЕДИТЫ =================
  function renderCredits() {
    const credits = AppStorage.get("credits", []);
    let html = `<div class="card"><h2>🏛 Кредиты</h2>`;
    if (credits.length) {
      html += credits.map((c,i) => `<div class="row" onclick="payCredit(${i})"><div><b>${esc(c.name)}</b><div class="mut">Остаток: ${fmt(c.remaining)} · Ставка: ${c.rate}%</div></div><b>Платёж: ${fmt(c.payment)}</b></div>`).join("");
    } else { html += `<div class="mut">Нет кредитов</div>`; }
    html += `</div><button class="bt pri" onclick="newCredit()">➕ Добавить кредит</button>`;
    return html;
  }
  function newCredit() {
    mini("Новый кредит", [["n","Название"],["r","Остаток",null,"",1],["p","Платёж",null,"",1],["s","Ставка %",null,"",1]], v => {
      const credits = AppStorage.get("credits", []);
      credits.push({ id: Date.now().toString(), name: v.n, remaining: pos(v.r), payment: pos(v.p), rate: num(v.s) });
      AppStorage.set("credits", credits);
    });
  }
  function payCredit(i) {
    const credits = AppStorage.get("credits", []);
    const c = credits[i];
    mini("Платёж по кредиту", [["w","Кошелёк",W()],["s","Сумма",null,c.payment,1]], v => {
      const s = pos(v.s);
      FinanceAPI.spend({ wallet: v.w, amount: s, category: "Кредит", note: c.name });
      c.remaining -= s;
      if (c.remaining <= 0) credits.splice(i, 1);
      AppStorage.set("credits", credits);
    });
  }

  // ================= 6. КАТЕГОРИИ =================
  function renderCategories() {
    const cats = State.getCategories();
    let html = `<div class="card"><h2>Расходы</h2>${cats.expense.map(c => `<div class="row" style="cursor:default"><span>${esc(c)}</span></div>`).join("")}</div>`;
    html += `<div class="card"><h2>Доходы</h2>${cats.income.map(c => `<div class="row" style="cursor:default"><span>${esc(c)}</span></div>`).join("")}</div>`;
    html += `<button class="bt" onclick="newCategory()">➕ Добавить категорию</button>`;
    return html;
  }
  function newCategory() {
    mini("Новая категория", [["t","Тип",["Расход","Доход"]],["n","Название"]], v => {
      if (!v.n) throw "Введите название";
      const cats = State.getCategories();
      if (v.t === "Расход") cats.expense.push(v.n); else cats.income.push(v.n);
      State.setCategories(cats);
    });
  }

  // ================= 7. ОТЧЁТЫ =================
  function renderReports() {
    const wallets = State.getWallets();
    const totalW = Object.values(wallets).reduce((a, b) => a + b, 0);
    const debts = State.getDebts().reduce((a, d) => a + (d.type === 'owe_me' ? d.amount : -d.amount), 0);
    const credits = AppStorage.get("credits", []).reduce((a, c) => a - c.remaining, 0);
    const net = totalW + debts + credits;

    return `<div class="card"><h2>Чистый капитал</h2><h1 class="${net >= 0 ? 'g' : 'r'}">${fmt(net)} лей</h1><div class="mut" style="margin-top:8px">Кошельки: ${fmt(totalW)}<br>Долги (нетто): ${fmt(debts)}<br>Кредиты: ${fmt(credits)}</div></div>`;
  }

  // ================= РЕНДЕР =================
  function render() {
    const tabs = [["home","💰 Кошельки"],["goals","🎯 Цели"],["debts","🤝 Долги"],["more","⚙️ Ещё"]];
    let html = `<div class="tabs">${tabs.map(([k,l]) => `<div class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</div>`).join("")}</div>`;

    if (tab === "home") html += renderHome();
    else if (tab === "goals") html += renderGoals();
    else if (tab === "debts") html += renderDebts();
    else if (tab === "more") {
      html += `<div class="card" style="padding:0">
        <button class="menu-btn" onclick="tab='budgets';render()">💳 Бюджеты</button>
        <button class="menu-btn" onclick="tab='credits';render()">🏛 Кредиты</button>
        <button class="menu-btn" onclick="tab='categories';render()">🗂 Категории</button>
        <button class="menu-btn" onclick="tab='reports';render()">📊 Отчёты и капитал</button>
      </div>
      <button class="bt" style="margin-top:20px" onclick="if(confirm('Сбросить все данные?')){localStorage.clear();location.reload()}">🗑 Сбросить всё</button>`;
    }
    else if (tab === "budgets") { html += `<button class="bt" onclick="tab='more';render()">← Назад</button>` + renderBudgets(); }
    else if (tab === "credits") { html += `<button class="bt" onclick="tab='more';render()">← Назад</button>` + renderCredits(); }
    else if (tab === "categories") { html += `<button class="bt" onclick="tab='more';render()">← Назад</button>` + renderCategories(); }
    else if (tab === "reports") { html += `<button class="bt" onclick="tab='more';render()">← Назад</button>` + renderReports(); }

    $("app").innerHTML = html;
  }

  render();
</script>
</body>
</html>
