<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>💼 Финансы</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    h1 { font-size: 28px; margin: 4px 0 8px; }
    h2 { font-size: 15px; margin: 2px 0 8px; color: var(--text-dim); font-weight: 600; }
    .mut { color: var(--text-dim); font-size: 12px; }
    .g { color: var(--green); } .r { color: var(--red); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); cursor: pointer; }
    .card > .row:first-of-type, .card > h2 + .row { border-top: 0; }
    .row b { white-space: nowrap; }
    .two { display: flex; gap: 10px; } .two > div { flex: 1; }
    
    .tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 14px; position: sticky; top: 0; z-index: 5; }
    .tabs div { flex: 1; text-align: center; padding: 9px 2px; font-size: 12px; font-weight: 600; border-radius: 10px; cursor: pointer; color: var(--text-dim); }
    .tabs div.on { background: var(--panel); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    
    .bt, input, select, textarea { width: 100%; font: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 11px; margin: 4px 0; }
    .bt { background: var(--panel); text-align: center; cursor: pointer; font-weight: 600; }
    .bt.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
    label { font-size: 12px; color: var(--text-dim); display: block; margin-top: 6px; }
    
    .fab { position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom,0px)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 30px; box-shadow: 0 4px 14px #0005; z-index: 9; }
    
    #ov { display: none; position: fixed; inset: 0; background: #0007; align-items: flex-end; z-index: 50; }
    #ov.on { display: flex; }
    #sh { background: var(--panel); width: 100%; max-width: 480px; margin: 0 auto; border-radius: 18px 18px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom,0px)); max-height: 90%; overflow: auto; }
    
    .seg { display: flex; gap: 6px; margin-bottom: 8px; }
    .seg button { flex: 1; padding: 9px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
    .seg button.on { background: var(--accent); color: #fff; }
    .err { color: var(--red); font-size: 14px; min-height: 18px; }
    
    .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar i { display: block; height: 100%; background: var(--green); }
  </style>
</head>
<body>
<div class="container" id="app"></div>
<button class="fab" onclick="sheet('Трата')">＋</button>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html" class="active"><span>💼</span>Финансы</a>
    <a href="cash.html"><span>🛵</span>Скутер</a>
    <a href="stats.html"><span>📈</span>Отчёты</a>
    <a href="settings.html"><span>⚙</span>Настройки</a>
  </div>
</nav>

<div id="ov"><div id="sh"></div></div>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/guard.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script src="js/domain/finance-api.js"></script>
<script>
  Theme.init();
  const $ = id => document.getElementById(id);
  const esc = UI.esc;
  const fmt = UI.fmt;
  const r2 = UI.r2;
  const num = UI.num;
  const pos = x => { x = r2(num(x)); if (!(x > 0)) throw "Сумма должна быть больше нуля"; return x; };
  const nowS = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()); };
  const nid = () => Math.max(0, ...State.getOps().map(z => z.id || 0)) + 1;
  const mid = a => Math.max(0, ...a.map(x => x.id || 0)) + 1;
  const opt = (a, s) => a.map(x => `<option${x === s ? " selected" : ""}>${esc(x)}</option>`).join("");
  const W = () => Object.keys(State.getWallets());
  
  let tab = "home", MF = null, MM = [];

  function toast(t) { Notify.show(t); }
  const err = e => Notify.error(typeof e === "string" ? e : e.message);

  function sheet(tip) {
    const w = W();
    let h = `<div class="seg">${["Трата","Доход"].map(t => `<button class="${t===tip?"on":""}" onclick="sheet('${t}')">${t}</button>`).join("")}</div>`;
    h += `<input id="f_s" inputmode="decimal" placeholder="Сумма">
          <label>Кошелёк</label><select id="f_w">${opt(w)}</select>
          <label>Категория</label><select id="f_k">${opt(tip==="Трата"?State.getCategories().expense:State.getCategories().income)}</select>
          <input id="f_n" placeholder="Заметка">
          <div class="err" id="f_e"></div>
          <button class="bt pri" onclick="submit('${tip}')">Сохранить</button>
          <button class="bt" onclick="closeSheet()">Отмена</button>`;
    $("sh").innerHTML = h; $("ov").classList.add("on");
  }

  function submit(tip) {
    try {
      const s = num($("f_s").value), n = $("f_n").value.trim();
      if (s <= 0) throw "Введите сумму";
      const w = $("f_w").value;
      const cat = $("f_k").value;
      
      if (tip === "Трата") FinanceAPI.spend({ wallet: w, amount: s, category: cat, note: n });
      else FinanceAPI.receive({ wallet: w, amount: s, category: cat, note: n });
      
      closeSheet(); render(); toast("Сохранено");
    } catch (e) { $("f_e").textContent = e.message || e; }
  }

  function closeSheet() { $("ov").classList.remove("on"); }
  $("ov").addEventListener("click", e => { if (e.target.id === "ov") closeSheet(); });

  function mm(t, it) { $("sh").innerHTML = `<h2>${t}</h2>` + it.map((x,i) => `<button class="bt${i?"":" pri"}" onclick="MM[${i}]()">${x[0]}</button>`).join("") + `<button class="bt" onclick="closeSheet()">Закрыть</button>`; MM = it.map(x => x[1]); $("ov").classList.add("on"); }
  function mini(t, fs, ok, hint) { MF = { fs, ok }; $("sh").innerHTML = `<h2>${t}</h2>${hint?`<div class="mut">${hint}</div>`:""}` + fs.map(f => f[2] ? `<label>${f[1]}</label><select id="m_${f[0]}">${opt(f[2], f[3])}</select>` : `<input id="m_${f[0]}" placeholder="${f[1]}" value="${esc(f[3]??"")}"${f[4]?' inputmode="decimal"':""}>`).join("") + `<div class="err" id="m_e"></div><button class="bt pri" onclick="miniOk()">Готово</button><button class="bt" onclick="closeSheet()">Отмена</button>`; $("ov").classList.add("on"); }
  function miniOk() { const v = {}; MF.fs.forEach(f => v[f[0]] = $("m_" + f[0]).value.trim()); try { MF.ok(v); closeSheet(); render(); toast("Сохранено"); } catch (e) { $("m_e").textContent = typeof e === "string" ? e : e.message; } }
  function ask(t, yes) { $("sh").innerHTML = `<p>${esc(t)}</p><button class="bt pri" onclick="closeSheet();(${yes})()">Да</button><button class="bt" onclick="closeSheet()">Нет</button>`; $("ov").classList.add("on"); }

  // ================= ЦЕЛИ =================
  function renderGoals() {
    const goals = State.getGoals();
    let html = `<div class="card"><h2>🎯 Мои цели</h2>`;
    if (goals.length) {
      html += goals.map((g, i) => {
        const percent = g.target > 0 ? Math.min(100, Math.round(g.saved / g.target * 100)) : 0;
        return `<div class="row" style="display:block" onclick="goalMenu(${i})">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <b>${esc(g.name)}</b>
            <span>${fmt(g.saved)} / ${fmt(g.target)}</span>
          </div>
          <div class="bar"><i style="width:${percent}%"></i></div>
          <div class="mut" style="margin-top:4px;text-align:right">${percent}%</div>
        </div>`;
      }).join("");
    } else {
      html += `<div class="mut">Пока нет целей</div>`;
    }
    html += `</div><button class="bt pri" onclick="newGoal()">➕ Новая цель</button>`;
    return html;
  }

  function newGoal() {
    mini("Новая цель", [["n","Название"],["s","Сумма",null,"",1]], v => {
      if (!v.n) throw "Введите название";
      const goals = State.getGoals();
      goals.push({ id: Date.now().toString(), name: v.n, target: pos(v.s), saved: 0 });
      State.setGoals(goals);
    });
  }

  function goalMenu(i) {
    const goals = State.getGoals();
    const g = goals[i];
    mm(esc(g.name), [
      ["➕ Пополнить", () => addToGoal(i)],
      ["➖ Снять", () => removeFromGoal(i)],
      ["🗑 Удалить", () => {
        if (g.saved > 0) return toast("Сначала снимите деньги с цели");
        goals.splice(i, 1); State.setGoals(goals); render(); toast("Удалено");
      }]
    ]);
  }

  function addToGoal(i) {
    const goals = State.getGoals();
    const g = goals[i];
    mini("Пополнить", [["w","Кошелёк",W()],["s","Сумма",null,"",1]], v => {
      const s = pos(v.s);
      FinanceAPI.spend({ wallet: v.w, amount: s, category: "Цель", note: g.name });
      g.saved += s; State.setGoals(goals);
    });
  }

  function removeFromGoal(i) {
    const goals = State.getGoals();
    const g = goals[i];
    mini("Снять", [["w","Кошелёк",W()],["s","Сумма",null,"",1]], v => {
      const s = pos(v.s);
      if (s > g.saved) throw "В цели меньше денег";
      FinanceAPI.receive({ wallet: v.w, amount: s, category: "Цель", note: g.name });
      g.saved -= s; State.setGoals(goals);
    });
  }

  // ================= ДОЛГИ =================
  function renderDebts() {
    const debts = State.getDebts();
    let html = `<div class="card"><h2>🤝 Долги</h2>`;
    if (debts.length) {
      html += debts.map(d => `
        <div class="row" onclick="debtMenu('${d.id}')">
          <div>${d.type === 'i_owe' ? '🔴' : '🟢'} ${esc(d.name)}
            <div class="mut">${d.type === 'i_owe' ? 'Я должен' : 'Мне должны'}</div>
          </div>
          <b>${fmt(d.amount)} лей</b>
        </div>
      `).join("");
    } else {
      html += `<div class="mut">Нет активных долгов</div>`;
    }
    html += `</div><button class="bt pri" onclick="newDebt()">➕ Новый долг</button>`;
    return html;
  }

  function newDebt() {
    mini("Новый долг", [
      ["t","Тип",["Я должен","Мне должны"]],
      ["n","Кому/Кто"],
      ["s","Сумма",null,"",1]
    ], v => {
      if (!v.n) throw "Введите имя";
      const debts = State.getDebts();
      debts.push({ id: Date.now().toString(), type: v.t === "Я должен" ? "i_owe" : "owe_me", name: v.n, amount: pos(v.s) });
      State.setDebts(debts);
    });
  }

  function debtMenu(id) {
    const debts = State.getDebts();
    const d = debts.find(x => x.id === id);
    mm(esc(d.name), [
      ["✅ Погасить", () => payDebt(id)],
      ["🗑 Удалить", () => {
        State.setDebts(debts.filter(x => x.id !== id));
        render(); toast("Удалено");
      }]
    ]);
  }

  function payDebt(id) {
    const debts = State.getDebts();
    const d = debts.find(x => x.id === id);
    mini("Погашение", [["w","Кошелёк",W()],["s","Сумма",null,d.amount,1]], v => {
      const s = pos(v.s);
      if (s > d.amount) throw "Больше остатка долга";
      if (d.type === 'i_owe') {
        FinanceAPI.spend({ wallet: v.w, amount: s, category: "Долг", note: "Погашение" });
      } else {
        FinanceAPI.receive({ wallet: v.w, amount: s, category: "Долг", note: "Возврат" });
      }
      d.amount -= s;
      if (d.amount <= 0) State.setDebts(debts.filter(x => x.id !== id));
      else State.setDebts(debts);
    });
  }

  // ================= РЕНДЕР =================
  function render() {
    const tabs = [["home","💰 Кошельки"],["goals","🎯 Цели"],["debts","🤝 Долги"],["more","⚙️ Ещё"]];
    let html = `<div class="tabs">${tabs.map(([k,l]) => `<div class="${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</div>`).join("")}</div>`;

    if (tab === "home") {
      const wallets = State.getWallets();
      const ops = State.getOps().slice().reverse().slice(0, 5);
      html += `<div class="card"><h2>Кошельки</h2>${Object.keys(wallets).map(w => `<div class="row" style="cursor:default"><span>${esc(w)}</span><b>${fmt(wallets[w])} лей</b></div>`).join("")}</div>`;
      html += `<div class="card"><h2>Последние операции</h2>${ops.length ? ops.map(o => `
        <div class="row" style="cursor:default">
          <div>${o.kind === 'expense' ? '➖' : '➕'} ${esc(o.cat)}<div class="mut">${o.date}</div></div>
          <b class="${o.kind === 'expense' ? 'r' : 'g'}">${o.amount > 0 ? '+' : ''}${fmt(o.amount)}</b>
        </div>
      `).join("") : '<div class="mut">Нет операций</div>'}</div>`;
    } else if (tab === "goals") {
      html += renderGoals();
    } else if (tab === "debts") {
      html += renderDebts();
    } else if (tab === "more") {
      html += `<div class="card"><h2>Разделы</h2><div class="mut" style="padding:10px">Бюджеты, Кредиты, Активы и Отчёты скоро появятся.</div></div>`;
    }

    $("app").innerHTML = html;
  }

  render();
</script>
</body>
</html>
