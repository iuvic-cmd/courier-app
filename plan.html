<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>📋 План и факт</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 90px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 24px; cursor: pointer; }
    
    .goal-banner { background: var(--warn-bg); border-left: 5px solid #ffb800; padding: 14px 16px; margin-bottom: 16px; border-radius: 0 8px 8px 0; font-size: 14px; white-space: pre-line; cursor: pointer; min-height: 20px; color: #8a5a00; }
    :root[data-theme="dark"] .goal-banner { background: #2a1f0a; color: #ffcf80; border-color: #ffb800; }

    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .tot { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .tot small { display: block; font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
    .tot b { display: block; font-size: 18px; margin-top: 4px; }
    .tot.plan b { color: var(--accent); }
    .tot.fact b { color: var(--green); }
    .tot.diff b { color: var(--red); }
    .tot.diff.plus b { color: var(--green); }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar button { flex: 1; min-width: 100px; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .toolbar button.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
    
    .section { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .section h2 { color: var(--accent); font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; cursor: pointer; }
    .section h2 small { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    
    .task { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .task:last-child { border-bottom: 0; }
    .task-row1 { display: flex; align-items: flex-start; gap: 10px; }
    .task-row1 input[type="checkbox"] { width: 20px; height: 20px; flex: 0 0 auto; margin-top: 2px; accent-color: var(--accent); }
    .task-title { flex: 1; font-weight: 600; cursor: pointer; }
    .task-title.done { text-decoration: line-through; color: var(--text-dim); }
    .task-note { font-size: 12px; color: var(--text-dim); margin-top: 2px; white-space: pre-line; }
    
    .task-nums { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-left: 30px; }
    .task-num { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
    .task-num small { display: block; font-size: 10px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; }
    .task-num input { width: 100%; border: none; background: transparent; color: var(--text); font-size: 16px; font-weight: 700; padding: 0; margin-top: 2px; outline: none; }
    .task-num.fact input { color: var(--green); }
    .task-num.diff b { display: block; font-size: 16px; margin-top: 2px; }
    .diff-neg { color: var(--red); }
    .diff-pos { color: var(--green); }
    .task-actions { margin-left: auto; }
    .task-actions button { background: none; border: none; font-size: 16px; cursor: pointer; padding: 4px; }

    .addhere { width: 100%; margin-top: 10px; padding: 10px; border: 1px dashed var(--border); border-radius: 10px; background: transparent; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; }
    .empty { color: var(--text-dim); font-size: 14px; padding: 8px 0; }
    
    .footer { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-dim); white-space: pre-line; cursor: pointer; min-height: 20px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 3000; overflow-y: auto; }
    .modal.on { display: block; }
    .modal-box { background: var(--panel); color: var(--text); margin: 10vh auto 24px; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; }
    .modal-box h3 { font-size: 18px; margin-bottom: 16px; text-align: center; }
    .modal-box label { display: block; font-size: 13px; color: var(--text-dim); margin-top: 10px; }
    .modal-box input, .modal-box textarea, .modal-box select { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 16px; background: var(--bg); color: var(--text); font-family: inherit; margin-top: 4px; }
    .modal-box textarea { min-height: 80px; resize: vertical; }
    .modal-box .row { display: flex; gap: 8px; margin-top: 16px; }
    .modal-box .row button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .modal-box .ok { background: var(--accent); color: #fff; }
    .modal-box .no { background: var(--border); color: var(--text); }
    .err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 id="planTitle" onclick="openSettings()">📋 План и факт</h1>
  </div>

  <div class="goal-banner" id="goalBanner" onclick="openSettings()"></div>

  <div class="totals">
    <div class="tot plan"><small>План</small><b id="totPlan">0</b></div>
    <div class="tot fact"><small>Факт</small><b id="totFact">0</b></div>
    <div class="tot diff" id="totDiffWrap"><small>Разница</small><b id="totDiff">0</b></div>
  </div>

  <div class="toolbar">
    <button class="pri" onclick="openTaskModal(null)">➕ Задача</button>
    <button onclick="addSection()">📂 Блок</button>
    <button onclick="toggleEdit()" id="editBtn">✏ Режим</button>
  </div>

  <div id="sections"></div>

  <div class="footer" id="checkpoint" onclick="openSettings()"></div>
</div>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html"><span>💼</span>Финансы</a>
    <a href="cash.html"><span>🛵</span>Скутер</a>
    <a href="stats.html"><span>📈</span>Отчёты</a>
    <a href="plan.html" class="active"><span>📋</span>План</a>
    <a href="settings.html"><span>⚙</span>Настройки</a>
  </div>
</nav>

<!-- Модалка задачи -->
<div id="taskModal" class="modal">
  <div class="modal-box">
    <h3 id="taskModalTitle">Новая задача</h3>
    <label>Заголовок</label>
    <input id="tTitle" placeholder="Например: Оплатить интернет">
    <label>Описание</label>
    <textarea id="tNote" placeholder="Детали..."></textarea>
    <label>План (лей)</label>
    <input id="tPlan" inputmode="decimal" placeholder="0">
    <label>Факт (лей)</label>
    <input id="tFact" inputmode="decimal" placeholder="0">
    <label>Раздел</label>
    <select id="tSection"></select>
    <div class="err" id="tErr"></div>
    <div class="row">
      <button class="ok" onclick="saveTask()">💾 Сохранить</button>
      <button class="no" onclick="closeTaskModal()">Отмена</button>
    </div>
  </div>
</div>

<!-- Модалка настроек плана -->
<div id="setModal" class="modal">
  <div class="modal-box">
    <h3>Настройки плана</h3>
    <label>Месяц</label>
    <input id="sMonth" placeholder="Ноябрь 2026">
    <label>Цель (жёлтый баннер)</label>
    <textarea id="sGoal" placeholder="Главная цель..."></textarea>
    <label>Итоги (внизу)</label>
    <textarea id="sCheck" placeholder="Что должно быть сделано..."></textarea>
    <div class="err" id="sErr"></div>
    <div class="row">
      <button class="ok" onclick="saveSettings()">💾 Сохранить</button>
      <button class="no" onclick="closeSettings()">Отмена</button>
    </div>
  </div>
</div>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script>
  Theme.init();
  const $ = id => document.getElementById(id);
  const LS = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const esc = UI.esc;
  const fmt = x => (+x || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 });
  const num = v => parseFloat(String(v || "").replace(",", ".")) || 0;
  const newId = () => "t_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  let editingTaskId = null;
  let editMode = false;

  // Загрузка плана
  function loadPlan() {
    let p = LS("uchot.v2.plan", null);
    if (!p || !Array.isArray(p.sections)) {
      p = { month: "Мой план", goal: "", checkpoint: "", sections: [{ key: "main", title: "📋 Мой план на месяц", tasks: [] }] };
      save("uchot.v2.plan", p);
    }
    return p;
  }
  let P = loadPlan();

  function persist() { save("uchot.v2.plan", P); }

  function render() {
    $("planTitle").innerHTML = `📋 ${esc(P.month)}`;
    $("goalBanner").textContent = P.goal || "Нажмите здесь, чтобы добавить цель...";
    $("checkpoint").textContent = P.checkpoint || "Нажмите здесь, чтобы добавить итоги...";

    $("sections").innerHTML = P.sections.map(sec => {
      return `<div class="section">
        <h2 onclick="editSection('${esc(sec.key)}')"><span>${esc(sec.title)}</span><small>План ${fmt(sec.tasks.reduce((a,t) => a + num(t.plan), 0))} · Факт ${fmt(sec.tasks.reduce((a,t) => a + num(t.fact), 0))}</small></h2>
        ${sec.tasks.map(t => {
          return `<div class="task">
            <div class="task-row1">
              <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleDone('${esc(t.id)}', this.checked)">
              <div class="task-title ${t.done ? "done" : ""}" onclick="openTaskModal('${esc(t.id)}')">
                ${esc(t.title)}
                ${t.note ? `<div class="task-note">${esc(t.note)}</div>` : ""}
              </div>
              ${editMode ? `<div class="task-actions"><button onclick="removeTask('${esc(t.id)}')">🗑</button></div>` : ""}
            </div>
            <div class="task-nums">
              <div class="task-num"><small>План</small><input type="number" value="${t.plan || ""}" onchange="setNum('${esc(t.id)}','plan',this)"></div>
              <div class="task-num fact"><small>Факт</small><input type="number" value="${t.fact || ""}" onchange="setNum('${esc(t.id)}','fact',this)"></div>
              <div class="task-num diff"><small>Разница</small><b data-diff="${esc(t.id)}"></b></div>
            </div>
          </div>`;
        }).join("") || `<div class="empty">Задач нет</div>`}
        <button class="addhere" onclick="openTaskModal(null, '${esc(sec.key)}')">➕ Задача в этот блок</button>
      </div>`;
    }).join("");

    $("tSection").innerHTML = P.sections.map(s => `<option value="${esc(s.key)}">${esc(s.title)}</option>`).join("");
    $("editBtn").textContent = editMode ? "✅ Готово" : "✏ Режим";
    updateTotals();
  }

  function updateTotals() {
    const all = P.sections.flatMap(s => s.tasks);
    const p = all.reduce((a, t) => a + num(t.plan), 0);
    const f = all.reduce((a, t) => a + num(t.fact), 0);
    const d = f - p;
    $("totPlan").textContent = fmt(p);
    $("totFact").textContent = fmt(f);
    $("totDiff").textContent = (d > 0 ? "+" : "") + fmt(d);
    $("totDiffWrap").classList.toggle("plus", d >= 0);
    
    P.sections.forEach(sec => {
      sec.tasks.forEach(t => {
        const diffEl = document.querySelector(`[data-diff="${esc(t.id)}"]`);
        if (diffEl) {
          const td = num(t.fact) - num(t.plan);
          diffEl.textContent = (td > 0 ? "+" : "") + fmt(td);
          diffEl.className = td < 0 ? "diff-neg" : td > 0 ? "diff-pos" : "";
        }
      });
    });
  }

  function findTask(id) {
    for (const s of P.sections) {
      const i = s.tasks.findIndex(t => t.id === id);
      if (i >= 0) return { sec: s, task: s.tasks[i], idx: i };
    }
    return null;
  }

  function toggleDone(id, val) {
    const f = findTask(id);
    if (f) { f.task.done = val; persist(); render(); }
  }

  function setNum(id, field, input) {
    const f = findTask(id);
    if (f) {
      f.task[field] = Math.max(0, Math.round(num(input.value)));
      input.value = f.task[field] || "";
      persist();
      updateTotals();
    }
  }

  function toggleEdit() { editMode = !editMode; render(); }

  function removeTask(id) {
    const f = findTask(id);
    if (f && confirm("Удалить задачу?")) {
      f.sec.tasks.splice(f.idx, 1);
      persist(); render();
    }
  }

  function addSection() {
    const title = prompt("Название нового блока:");
    if (title && title.trim()) {
      P.sections.push({ key: "s_" + Date.now(), title: title.trim(), tasks: [] });
      persist(); render();
    }
  }

  function editSection(key) {
    const sec = P.sections.find(s => s.key === key);
    if (!sec) return;
    const newTitle = prompt("Переименовать блок:", sec.title);
    if (newTitle !== null && newTitle.trim()) {
      sec.title = newTitle.trim(); persist(); render();
    }
  }

  function openTaskModal(id, secKey) {
    editingTaskId = id;
    const f = id ? findTask(id) : null;
    if (id && !f) return;
    
    $("taskModalTitle").textContent = id ? "Изменить задачу" : "Новая задача";
    $("tTitle").value = f ? f.task.title : "";
    $("tNote").value = f ? (f.task.note || "") : "";
    $("tPlan").value = f ? (f.task.plan || "") : "";
    $("tFact").value = f ? (f.task.fact || "") : "";
    $("tSection").value = f ? f.sec.key : (secKey || P.sections[0].key);
    $("tErr").textContent = "";
    $("taskModal").classList.add("on");
  }

  function closeTaskModal() { $("taskModal").classList.remove("on"); editingTaskId = null; }

  function saveTask() {
    const title = $("tTitle").value.trim();
    if (!title) { $("tErr").textContent = "Введите заголовок"; return; }
    
    const note = $("tNote").value.trim();
    const plan = Math.max(0, Math.round(num($("tPlan").value)));
    const fact = Math.max(0, Math.round(num($("tFact").value)));
    const sec = P.sections.find(s => s.key === $("tSection").value);
    
    if (editingTaskId) {
      const f = findTask(editingTaskId);
      if (f.sec !== sec) {
        f.sec.tasks.splice(f.idx, 1);
        sec.tasks.push({ ...f.task, title, note, plan, fact });
      } else {
        Object.assign(f.task, { title, note, plan, fact });
      }
    } else {
      sec.tasks.push({ id: newId(), title, note, plan, fact, done: false });
    }
    
    persist(); closeTaskModal(); render();
  }

  function openSettings() {
    $("sMonth").value = P.month || "";
    $("sGoal").value = P.goal || "";
    $("sCheck").value = P.checkpoint || "";
    $("sErr").textContent = "";
    $("setModal").classList.add("on");
  }

  function closeSettings() { $("setModal").classList.remove("on"); }

  function saveSettings() {
    const m = $("sMonth").value.trim();
    if (!m) { $("sErr").textContent = "Укажите месяц"; return; }
    P.month = m; P.goal = $("sGoal").value; P.checkpoint = $("sCheck").value;
    persist(); closeSettings(); render();
  }

  // Закрытие модалок по клику вне
  $("taskModal").addEventListener("click", e => { if (e.target.id === "taskModal") closeTaskModal(); });
  $("setModal").addEventListener("click", e => { if (e.target.id === "setModal") closeSettings(); });

  render();
</script>
</body>
</html>
