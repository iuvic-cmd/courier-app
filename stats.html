<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🛵 Скутер</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-top: 16px; padding-bottom: 90px; }
    .header { margin-bottom: 12px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--panel); padding: 12px; border-radius: 12px; text-align: center; border-left: 3px solid var(--accent); }
    .stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; display: block; }
    .stat-value { font-size: 18px; font-weight: 700; }

    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    .action-grid .btn { padding: 14px; font-size: 14px; }

    details.acc { margin-bottom: 12px; }
    details.acc > summary {
      list-style: none; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; cursor: pointer; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
    }
    details.acc > summary::-webkit-details-marker { display: none; }
    details.acc > summary::after { content: "▼"; font-size: 12px; color: var(--text-dim); }
    details.acc[open] > summary::after { content: "▲"; }

    .acc-body {
      background: var(--panel); border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 16px 16px; padding: 16px; margin-top: -4px;
    }

    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .input-row > div { flex: 1; min-width: 0; }
    .input-row label, .acc-body label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }

    .history-list { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .history-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: var(--text-dim); }
    .section-title { font-size: 14px; font-weight: 700; margin: 24px 0 10px; color: var(--text-dim); text-transform: uppercase; }

    .save-btn { width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; background: var(--green); color: white; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; transition: 0.2s; }
    .save-btn:active { background: #2e7d32; transform: scale(0.98); }
    .cancel-btn { width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; background: var(--border); color: var(--text); border: none; font-weight: 700; margin-top: 8px; cursor: pointer; }

    .check-row { display: flex !important; align-items: center; gap: 8px; font-size: 14px !important; color: var(--text) !important; margin: 4px 0 10px; }
    .check-row input { width: 20px; height: 20px; accent-color: var(--accent); }

    .svc-summary { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.7; }
    .svc-summary b { font-weight: 700; }
    .svc-list { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 0 16px; margin-top: 10px; }
    .svc-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .svc-row:last-child { border-bottom: none; }
    .svc-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .svc-right { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .del-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; }
    .empty-note { color: var(--text-dim); font-size: 13px; padding: 14px 0; text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛵 Скутер</h1>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">📊 Общий пробег</span>
      <span class="stat-value" id="statKm">0 км</span>
    </div>
    <div class="stat-card" style="border-left-color: var(--orange);">
      <span class="stat-label">⛽ Расход топлива</span>
      <span class="stat-value" id="statConsumption">0 л/100км</span>
    </div>
  </div>

  <div class="action-grid">
    <button class="btn btn-primary" onclick="toggleFuelForm()"><span>⛽</span> Заправка</button>
    <button class="btn btn-green" onclick="toggleMileageForm()"><span>📏</span> Пробег</button>
  </div>

  <!-- Кошельки для скутера -->
  <div class="section-title" style="margin-top: 0;">💰 Мои кошельки для скутера</div>
  <div id="scooterWallets" style="background: var(--panel); border-radius: 16px; padding: 0 16px; border: 1px solid var(--border); margin-bottom: 16px; display: none;"></div>
  <div class="hint" id="noScooterWallets" style="text-align: center; margin-bottom: 16px;">Пока нет оплат с кошельков. Сделай первую заправку или ТО.</div>

  <!-- Форма заправки -->
  <div id="fuelFormContainer" style="display: none; margin-bottom: 20px;">
    <div style="background: var(--panel); border: 2px solid var(--accent); border-radius: 16px; padding: 16px;">
      <h3 style="margin-bottom: 12px; font-size: 16px;">⛽ Новая заправка</h3>
      <div class="input-row">
        <div><label>Сумма по чеку</label><input type="number" id="f_total" class="form-control" placeholder="0" inputmode="decimal"></div>
        <div><label>Цена за литр</label><input type="number" id="f_price" class="form-control" placeholder="0" inputmode="decimal"></div>
      </div>
      <div style="margin-bottom: 12px;"><label>Кошелёк</label><select id="f_wall" class="form-control"></select></div>
      <button class="save-btn" onclick="saveFuel()">💾 СОХРАНИТЬ</button>
      <button class="cancel-btn" onclick="toggleFuelForm()">Отмена</button>
    </div>
  </div>

  <!-- Форма пробега -->
  <div id="mileageFormContainer" style="display: none; margin-bottom: 20px;">
    <div style="background: var(--panel); border: 2px solid var(--green); border-radius: 16px; padding: 16px;">
      <h3 style="margin-bottom: 12px; font-size: 16px;">📏 Обновить пробег</h3>
      <div style="margin-bottom: 12px;"><label>Текущий пробег (км)</label><input type="number" id="m_km" class="form-control" value="" inputmode="numeric"></div>
      <button class="save-btn" onclick="saveMileage()">💾 СОХРАНИТЬ</button>
      <button class="cancel-btn" onclick="toggleMileageForm()">Отмена</button>
    </div>
  </div>

  <div class="section-title">ТО и Расходники</div>
  <div id="componentsList"></div>

  <div class="section-title">Официальные документы</div>
  <div id="officialList"></div>

  <!-- История замен и учёт -->
  <div class="section-title">🧾 История замен и учёт</div>
  <select id="svcFilter" class="form-control" onchange="renderServiceHistory()" style="margin-bottom: 10px;"></select>
  <div class="svc-summary" id="svcSummary"></div>
  <div class="svc-list" id="svcList"></div>

  <div class="section-title">История</div>
  <div class="history-list" id="globalHistory" style="background: var(--panel); padding: 0 16px; border-radius: 16px; border: 1px solid var(--border);"></div>
</div>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html"><span>💼</span>Финансы</a>
    <a href="cash.html" class="active"><span>🛵</span>Скутер</a>
    <a href="stats.html"><span>📈</span>Отчёты</a>
    <a href="plan.html"><span>📋</span>План</a>
    <a href="settings.html"><span>⚙</span>Настройки</a>
  </div>
</nav>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/guard.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script src="js/domain/finance-api.js"></script>
<script>
  Theme.init();

  const $ = id => document.getElementById(id);
  const esc = UI.esc;
  const fmtDate = ds => String(ds || "").split("-").reverse().join(".");
  const money = x => UI.fmt(UI.r2(+x || 0));
  const fuelSum = f => +(f.total != null ? f.total : f.amount) || 0; // старые записи хранят сумму в amount

  const COMPONENTS = [
    { id: 'oil', title: '🛢 Масло', interval: 2000 },
    { id: 'air_filter', title: '💨 Воздушный фильтр', interval: 3000 },
    { id: 'belt', title: '⚙ Ремень', interval: 10000 },
    { id: 'brakes', title: '🛑 Колодки', interval: 5000 }
  ];
  const OFFICIALS = [
    { id: 'tech', title: '🛠 Техосмотр' },
    { id: 'tax', title: '💰 Налог на дорогу' },
    { id: 'insurance', title: '🛡 Страховка' }
  ];

  // Читает и старый (kind/expense), и новый (tip: Трата) формат операций,
  // возвращая только записи, связанные со скутером (Скутер/Топливо).
  function getScooterOps() {
    return State.getOps()
      .map(o => o.tip ? (o.tip === "Трата" ? { cat: o.kat, wallet: o.koshel } : null) : (o.kind === "expense" ? o : null))
      .filter(o => o && /Скутер|Топливо/.test(o.cat || ""));
  }

  function walletSelectHtml(onlyScooter = false) {
    const wallets = State.getWallets();
    let keys = Object.keys(wallets);
    if (onlyScooter) {
      const used = [...new Set(getScooterOps().map(o => o.wallet))];
      if (used.length > 0) keys = used;
    }
    return keys.map(w => `<option value="${esc(w)}">${esc(w)} (${wallets[w] || 0} лей)</option>`).join("");
  }

  // ---------- История замен: сбор записей ----------
  function serviceEntries() {
    const out = [];
    COMPONENTS.forEach(c => {
      (State.getComponent(c.id).history || []).forEach((h, idx) => out.push({
        key: "comp:" + c.id, kind: "comp", id: c.id, idx, title: c.title,
        date: h.date || "", km: +h.km || 0, cost: +h.cost || 0, wallet: h.wallet || "", note: h.note || ""
      }));
    });
    OFFICIALS.forEach(o => {
      (State.getOfficial(o.id).history || []).forEach((h, idx) => out.push({
        key: "off:" + o.id, kind: "off", id: o.id, idx, title: o.title,
        date: h.date || "", until: h.nextDate || "", cost: +h.cost || 0, wallet: h.wallet || "", note: ""
      }));
    });
    return out;
  }

  function renderServiceHistory() {
    const sel = $("svcFilter");
    if (!sel.options.length) {
      sel.innerHTML = `<option value="all">Все расходники и документы</option>` +
        COMPONENTS.map(c => `<option value="comp:${c.id}">${esc(c.title)}</option>`).join("") +
        OFFICIALS.map(o => `<option value="off:${o.id}">${esc(o.title)}</option>`).join("");
    }
    const filter = sel.value || "all";
    const all = serviceEntries();
    const list = all.filter(e => filter === "all" || e.key === filter)
      .sort((a, b) => b.date.localeCompare(a.date) || b.idx - a.idx);

    const year = UI.date.local().slice(0, 4);
    const total = list.reduce((s, e) => s + e.cost, 0);
    const thisYear = list.filter(e => e.date.startsWith(year)).reduce((s, e) => s + e.cost, 0);
    const fuels = State.getFuel();
    const fuelTotal = fuels.reduce((s, f) => s + fuelSum(f), 0);

    let html = `Записей: <b>${list.length}</b> · потрачено: <b>${money(total)} лей</b><br>В этом году: <b>${money(thisYear)} лей</b>`;
    if (filter.startsWith("comp:") && list.length) {
      const byKm = list.slice().sort((a, b) => a.km - b.km);
      html += `<br>Последняя замена: <b>${fmtDate(list[0].date)}</b> на <b>${Math.round(byKm[byKm.length - 1].km)} км</b>`;
      if (byKm.length >= 2) {
        const avg = (byKm[byKm.length - 1].km - byKm[0].km) / (byKm.length - 1);
        html += `<br>Средний пробег между заменами: <b>${Math.round(avg)} км</b>`;
      }
      if (list.length >= 1 && total > 0) html += `<br>Средняя цена замены: <b>${money(total / list.filter(e => e.cost > 0).length)} лей</b>`;
    }
    if (filter === "all") {
      html += `<br>⛽ Топливо за всё время: <b>${money(fuelTotal)} лей</b>`;
      html += `<br>Итого на скутер (ТО + топливо): <b>${money(total + fuelTotal)} лей</b>`;
    }
    $("svcSummary").innerHTML = html;

    $("svcList").innerHTML = list.length ? list.map(e => `
      <div class="svc-row">
        <div>
          <b>${esc(e.title)}</b>
          <div class="svc-sub">${fmtDate(e.date)} · ${e.kind === "comp" ? Math.round(e.km) + " км" : (e.until ? "до " + fmtDate(e.until) : "")}${e.wallet ? " · " + esc(e.wallet) : ""}${e.note ? " · " + esc(e.note) : ""}</div>
        </div>
        <div class="svc-right"><b>${e.cost ? money(e.cost) + " лей" : "—"}</b><button class="del-btn" onclick="deleteService('${e.kind}','${e.id}',${e.idx})">🗑</button></div>
      </div>`).join("") : `<div class="empty-note">Записей пока нет. Добавьте замену в блоке выше.</div>`;
  }

  function deleteService(kind, id, idx) {
    const data = kind === "comp" ? State.getComponent(id) : State.getOfficial(id);
    const h = (data.history || [])[idx];
    if (!h) return;
    if (!confirm(`Удалить запись от ${fmtDate(h.date)}?`)) return;
    if (h.opId != null && +h.cost > 0 && confirm(`Вернуть ${money(h.cost)} лей на кошелёк «${h.wallet || ""}»?`)) {
      try { FinanceAPI.undo(h.opId); } catch (e) { Notify.error(e.message); }
    }
    data.history.splice(idx, 1);
    if (kind === "comp") {
      const last = data.history.slice().sort((a, b) => (+a.km || 0) - (+b.km || 0)).pop();
      data.lastKm = last ? +last.km : 0;
      data.lastDate = last ? last.date : "";
      State.setComponent(id, data);
    } else {
      const last = data.history.slice().sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
      data.lastDate = last ? last.date : "";
      data.nextDate = last ? last.nextDate : "";
      data.cost = last ? +last.cost || 0 : 0;
      State.setOfficial(id, data);
    }
    render();
    Notify.show("🗑 Запись удалена");
  }

  // Прежние данные хранили только «последнюю замену» (lastKm/lastDate) без истории.
  // Переносим её в историю, чтобы новая запись не затирала старую, а дописывалась.
  function migrateLegacyHistory() {
    COMPONENTS.forEach(c => {
      const d = State.getComponent(c.id);
      if (!Array.isArray(d.history)) d.history = [];
      if (d.history.length === 0 && +d.lastKm > 0) {
        d.history.push({ date: d.lastDate || "", km: +d.lastKm, cost: 0, wallet: "", opId: null, note: "из прежних данных" });
        State.setComponent(c.id, d);
      }
    });
    OFFICIALS.forEach(o => {
      const d = State.getOfficial(o.id);
      if (!Array.isArray(d.history)) d.history = [];
      if (d.history.length === 0 && d.lastDate) {
        d.history.push({ date: d.lastDate, nextDate: d.nextDate || "", cost: +d.cost || 0, wallet: "", opId: null });
        State.setOfficial(o.id, d);
      }
    });
  }

  // ---------- Рендер ----------
  function render() {
    migrateLegacyHistory();
    const wallets = State.getWallets();

    const scooterOps = getScooterOps();
    const usedWallets = [...new Set(scooterOps.map(o => o.wallet))];
    if (usedWallets.length > 0) {
      $("scooterWallets").style.display = "block";
      $("noScooterWallets").style.display = "none";
      $("scooterWallets").innerHTML = usedWallets.map(w => `
        <div class="history-item" style="padding: 12px 0; border-bottom: 1px solid var(--border);">
          <span>${esc(w)}</span>
          <b style="color: var(--green);">${wallets[w] || 0} лей</b>
        </div>`).join("");
    } else {
      $("scooterWallets").style.display = "none";
      $("noScooterWallets").style.display = "block";
    }

    $("f_wall").innerHTML = walletSelectHtml();

    const scooter = State.getScooter();
    const fuels = State.getFuel();
    const totalKm = Math.max(scooter.currentKm - scooter.startKm, 0);
    $("statKm").innerText = totalKm.toFixed(1) + " км";
    const totalLiters = fuels.reduce((s, f) => s + (+f.liters || 0), 0);
    $("statConsumption").innerText = (totalKm > 0 ? (totalLiters / totalKm * 100) : 0).toFixed(2) + " л/100км";

    const today = UI.date.local();
    // Раскрытые блоки не сворачиваем при перерисовке
    const openIds = [...document.querySelectorAll("details.acc[open]")].map(d => d.id);

    $("componentsList").innerHTML = COMPONENTS.map(c => {
      const data = State.getComponent(c.id);
      const nextKm = data.lastKm ? data.lastKm + data.intervalKm : 0;
      const left = nextKm ? Math.round(nextKm - scooter.currentKm) : null;
      let status = "Не задано. Нажми чтобы настроить.";
      if (data.lastKm > 0) {
        // Отсчёт всегда идёт от пробега ПОСЛЕДНЕЙ замены, даже если прошлую поменяли раньше срока
        const driven = Math.max(Math.round(scooter.currentKm - data.lastKm), 0);
        status = left <= 0
          ? `⚠️ Пора менять! (просрочено на ${Math.abs(left)} км)`
          : `Осталось ${left} км · следующая на ${Math.round(nextKm)} км`;
        status += ` · с замены проехано ${driven} из ${data.intervalKm} км`;
        if (data.lastDate) status += ` · замена ${fmtDate(data.lastDate)} на ${Math.round(data.lastKm)} км`;
      }
      return `
      <details class="acc" id="acc_${c.id}">
        <summary><div><div>${c.title}</div><div style="font-size:12px;font-weight:400;color:var(--text-dim);margin-top:4px">${status}</div></div></summary>
        <div class="acc-body">
          <div class="input-row">
            <div><label>Дата замены</label><input type="date" id="c_date_${c.id}" class="form-control" value="${today}"></div>
            <div><label>Пробег (км)</label><input type="number" id="c_km_${c.id}" class="form-control" value="${Math.round(scooter.currentKm)}"></div>
          </div>
          <div class="input-row">
            <div><label>Интервал (км)</label><input type="number" id="c_int_${c.id}" class="form-control" value="${data.intervalKm || c.interval}"></div>
            <div><label>Стоимость (лей)</label><input type="number" id="c_cost_${c.id}" class="form-control" placeholder="0"></div>
          </div>
          <div style="margin-bottom: 10px;"><label>Кошелёк</label><select id="c_wall_${c.id}" class="form-control">${walletSelectHtml()}</select></div>
          <label class="check-row"><input type="checkbox" id="c_skip_${c.id}"> Не списывать с кошелька (старая запись)</label>
          <div style="margin-bottom: 10px;"><label>Заметка</label><input type="text" id="c_note_${c.id}" class="form-control" placeholder="Например: масло 10W-40"></div>
          <button class="save-btn" onclick="saveComponent('${c.id}', '${c.title}')">💾 ЗАПИСАТЬ ЗАМЕНУ</button>
          <div class="hint" style="margin-top:8px">Все замены — в блоке «История замен и учёт» ниже.</div>
        </div>
      </details>`;
    }).join("");

    $("officialList").innerHTML = OFFICIALS.map(o => {
      const data = State.getOfficial(o.id);
      const status = data.nextDate ? `Действует до: ${fmtDate(data.nextDate)} (${data.cost} лей)` : "Нет данных";
      return `
      <details class="acc" id="acc_off_${o.id}">
        <summary><div><div>${o.title}</div><div style="font-size:12px;font-weight:400;color:var(--text-dim);margin-top:4px">${status}</div></div></summary>
        <div class="acc-body">
          <div style="margin-bottom: 10px;"><label>Дата прохождения</label><input type="date" id="o_date_${o.id}" class="form-control" value="${today}"></div>
          <div style="margin-bottom: 10px;"><label>Действует до</label><input type="date" id="o_next_${o.id}" class="form-control" value="${data.nextDate || ""}"></div>
          <div style="margin-bottom: 10px;"><label>Стоимость (лей)</label><input type="number" id="o_cost_${o.id}" class="form-control" placeholder="0"></div>
          <div style="margin-bottom: 10px;"><label>Кошелёк</label><select id="o_wall_${o.id}" class="form-control">${walletSelectHtml()}</select></div>
          <label class="check-row"><input type="checkbox" id="o_skip_${o.id}"> Не списывать с кошелька (старая запись)</label>
          <button class="save-btn" onclick="saveOfficial('${o.id}', '${o.title}')">💾 СОХРАНИТЬ</button>
        </div>
      </details>`;
    }).join("");

    openIds.forEach(id => { const d = $(id); if (d) d.open = true; });

    renderServiceHistory();

    let historyHtml = "";
    State.getMileageLog().slice().reverse().slice(0, 5).forEach(m => historyHtml += `<div class="history-item"><span>📏 Пробег</span><span>${m.date}: <b>${m.km} км</b></span></div>`);
    fuels.slice().reverse().slice(0, 5).forEach(f => historyHtml += `<div class="history-item"><span>⛽ Заправка</span><span>${f.date}: <b>${money(fuelSum(f))} лей</b> (${(+f.liters || 0).toFixed(2)} л)</span></div>`);
    $("globalHistory").innerHTML = historyHtml || `<div class="history-item">Нет записей</div>`;
  }

  function toggleFuelForm() {
    const c = $("fuelFormContainer");
    c.style.display = c.style.display === "none" ? "block" : "none";
    if (c.style.display === "block") $("f_total").focus();
  }
  function toggleMileageForm() {
    const c = $("mileageFormContainer");
    c.style.display = c.style.display === "none" ? "block" : "none";
    if (c.style.display === "block") $("m_km").focus();
  }

  function saveFuel() {
    if (!guardAction("saveFuel")) return;
    try {
      const totalCost = UI.num($("f_total").value);
      const price = UI.num($("f_price").value);
      const wallet = $("f_wall").value;

      if (!wallet) throw new Error("Кошелёк не выбран");
      if (totalCost <= 0 || price <= 0) throw new Error("Заполните сумму и цену");

      const liters = UI.r2(totalCost / price);
      FinanceAPI.spend({ wallet, amount: totalCost, category: "Топливо (Скутер)", note: `${liters}л` });
      State.setFuel([...State.getFuel(), { date: UI.date.local(), liters, price, total: totalCost }]);
      toggleFuelForm();
      render();
      Notify.show(`✅ ${liters} л. Списано ${totalCost} лей`);
    } catch (e) { Notify.error(e.message); }
  }

  function saveMileage() {
    if (!guardAction("saveMileage")) return;
    try {
      const scooter = State.getScooter();
      const km = UI.num($("m_km").value);
      if (km < scooter.currentKm) throw new Error("Пробег не может уменьшаться");

      State.setMileageLog([...State.getMileageLog(), { date: UI.date.local(), km }]);
      scooter.currentKm = km;
      if (scooter.startKm === 0) scooter.startKm = km;
      State.setScooter(scooter);
      toggleMileageForm();
      render();
      Notify.show("✅ Пробег обновлен");
    } catch (e) { Notify.error(e.message); }
  }

  function saveComponent(id, title) {
    if (!guardAction("saveComp")) return;
    try {
      const data = State.getComponent(id);
      if (!Array.isArray(data.history)) data.history = [];
      const date = $(`c_date_${id}`).value;
      const km = UI.num($(`c_km_${id}`).value);
      const interval = UI.num($(`c_int_${id}`).value);
      const cost = UI.num($(`c_cost_${id}`).value);
      const wallet = $(`c_wall_${id}`).value;
      const skip = $(`c_skip_${id}`).checked;
      const note = $(`c_note_${id}`).value.trim();

      if (!date) throw new Error("Укажите дату замены");
      if (km <= 0 || interval <= 0) throw new Error("Заполните км и интервал");

      let opId = null;
      if (cost > 0 && !skip) {
        opId = FinanceAPI.spend({ date, wallet, amount: cost, category: `Скутер: ${title}`, note: note || `Замена на ${km} км` });
      }

      data.intervalKm = interval;
      // Старую запись не считаем «последней», если уже есть более свежая замена
      if (!data.lastKm || km >= data.lastKm) { data.lastKm = km; data.lastDate = date; }
      data.history.push({ date, km, cost, wallet: cost > 0 && !skip ? wallet : "", opId, note });
      data.history.sort((a, b) => String(a.date).localeCompare(String(b.date)) || (+a.km || 0) - (+b.km || 0));
      State.setComponent(id, data);
      render();
      Notify.show(`✅ Замена ${title} записана`);
    } catch (err) { Notify.error(err.message); }
  }

  function saveOfficial(id, title) {
    if (!guardAction("saveOff")) return;
    try {
      const data = State.getOfficial(id);
      if (!Array.isArray(data.history)) data.history = [];
      const date = $(`o_date_${id}`).value;
      const next = $(`o_next_${id}`).value;
      const cost = UI.num($(`o_cost_${id}`).value);
      const wallet = $(`o_wall_${id}`).value;
      const skip = $(`o_skip_${id}`).checked;

      if (!date || !next) throw new Error("Укажите даты");

      let opId = null;
      if (cost > 0 && !skip) {
        opId = FinanceAPI.spend({ date, wallet, amount: cost, category: `Скутер: ${title}`, note: `Оплата до ${next}` });
      }

      if (!data.lastDate || date >= data.lastDate) { data.lastDate = date; data.nextDate = next; data.cost = cost; }
      data.history.push({ date, nextDate: next, cost, wallet: cost > 0 && !skip ? wallet : "", opId });
      data.history.sort((a, b) => String(a.date).localeCompare(String(b.date)));
      State.setOfficial(id, data);
      render();
      Notify.show(`✅ ${title} записан`);
    } catch (err) { Notify.error(err.message); }
  }

  render();
</script>
</body>
</html>
