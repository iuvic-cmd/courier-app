<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>⚙ Настройки</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 90px; }
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 24px; }
    .card { background: var(--panel); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .card h3 { font-size: 16px; margin-bottom: 12px; color: var(--accent); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
    .form-control { width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font-size: 16px; }
    .btn-save { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; background: var(--green); color: white; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; }
    .btn-danger { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; background: var(--red); color: white; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; }
    .btn-warn { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; background: var(--orange); color: white; border: none; font-weight: 700; margin-top: 8px; cursor: pointer; }
    .hint { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; line-height: 1.5; }
    .file-input { display: none; }
    .file-label { display: block; padding: 14px; background: var(--accent); color: #fff; text-align: center; border-radius: 12px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .btn-sm-reset { padding: 12px; font-size: 13px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; color: #fff; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙ Настройки</h1>
  </div>

  <!-- Импорт -->
  <div class="card">
    <h3>📥 Импорт данных</h3>
    <p class="hint">Выбери файл `import-data.json` для восстановления данных.</p>
    <label for="fileInput" class="file-label">📂 Выбрать файл</label>
    <input type="file" id="fileInput" class="file-input" accept=".json" onchange="handleFile(this)">
    <div id="importStatus" class="hint" style="margin-top:10px;"></div>
  </div>

  <!-- Тариф -->
  <div class="card">
    <h3>💰 Настройка тарифа</h3>
    <div class="form-group">
      <label>🌙 Ночной заказ (лей)</label>
      <input type="number" id="tariffNight" class="form-control" placeholder="73">
    </div>
    <div class="form-group">
      <label>📦 Единый заказ (лей)</label>
      <input type="number" id="tariffAp" class="form-control" placeholder="54">
    </div>
    <div class="form-group">
      <label>📅 Действует с</label>
      <input type="date" id="tariffDate" class="form-control">
    </div>
    <button class="btn-save" onclick="saveTariff()">💾 Применить тариф</button>
  </div>

  <!-- Сброс по разделам -->
  <div class="card" style="border-color: var(--red);">
    <h3 style="color: var(--red);">⚠️ Сброс данных</h3>
    <p class="hint">Выбери, что именно удалить. Действие необратимо.</p>
    
    <div class="btn-grid">
      <button class="btn-sm-reset" style="background: var(--orange);" onclick="resetSection('days')">📦 Дни и учёт</button>
      <button class="btn-sm-reset" style="background: var(--accent);" onclick="resetSection('fin')">💼 Финансы</button>
      <button class="btn-sm-reset" style="background: var(--purple);" onclick="resetSection('cash')">🛵 Скутер</button>
      <button class="btn-sm-reset" style="background: var(--text-dim);" onclick="resetSection('settings')">⚙ Настройки</button>
    </div>

    <button class="btn-danger" onclick="resetAllData()" style="margin-top:20px;">🗑 Сбросить ВСЁ</button>
  </div>
</div>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html"><span>💼</span>Финансы</a>
    <a href="cash.html"><span>🛵</span>Скутер</a>
    <a href="stats.html"><span>📈</span>Отчёты</a>
    <a href="settings.html" class="active"><span>⚙</span>Настройки</a>
  </div>
</nav>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script src="js/domain/tariff.js"></script>
<script>
  Theme.init();

  // --- Импорт ---
  function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        let count = 0;
        for (const key in data) {
          if (key.startsWith("uchot.v2.")) {
            localStorage.setItem(key, JSON.stringify(data[key]));
            count++;
          }
        }
        document.getElementById("importStatus").innerHTML = `<span style="color: green">✅ Импортировано ключей: ${count}. Перезагрузка...</span>`;
        setTimeout(() => location.reload(), 1500);
      } catch (err) {
        document.getElementById("importStatus").innerHTML = `<span style="color: red">❌ Ошибка: ${err.message}</span>`;
      }
    };
    reader.readAsText(file);
  }

  // --- Тариф ---
  function saveTariff() {
    const night = parseInt(document.getElementById("tariffNight").value);
    const ap = parseInt(document.getElementById("tariffAp").value);
    const date = document.getElementById("tariffDate").value;
    if (!(night > 0) || !(ap > 0)) return Notify.error("Введите цены");
    if (!date) return Notify.error("Укажите дату");
    Tariff.setNewRate(date, night, ap);
    Notify.show(`✅ Тариф с ${date}: 🌙${night} / 📦${ap}`);
  }

  // --- Сброс по разделам ---
  function resetSection(section) {
    const names = {
      days: "Дни учёта (календарь, заказы, лог)",
      fin: "Финансы (кошельки, операции, долги, кредиты)",
      cash: "Скутер (пробег, заправки, ТО)",
      settings: "Настройки смен, подмоги, тариф"
    };
    if (!confirm(`Удалить раздел «${names[section]}»? Это действие необратимо.`)) return;

    const keysToRemove = [];

    if (section === "days") {
      keysToRemove.push("days", "orders_log");
    } else if (section === "fin") {
      keysToRemove.push("wallets", "ops", "debts", "goals", "credits", "cards", "lombard", "lombard_info", "assets", "budgets", "regulars", "categories", "currencies", "rates");
    } else if (section === "cash") {
      keysToRemove.push("scooter", "scooter_fuel", "mileage_log", "comp_oil", "comp_air_filter", "comp_belt", "comp_brakes", "scooter_expenses");
    } else if (section === "settings") {
      keysToRemove.push("shift", "help", "roster", "tariff", "pin");
    }

    keysToRemove.forEach(k => localStorage.removeItem("uchot.v2." + k));
    Notify.show(`✅ Раздел «${names[section]}» удален`);
    setTimeout(() => location.reload(), 800);
  }

  // --- Полный сброс ---
  function resetAllData() {
    if (!confirm("ВНИМАНИЕ! Удалить ВСЕ данные приложения? Это необратимо.")) return;
    Object.keys(localStorage).forEach(key => {
      if (key.startsWith("uchot.v2.")) localStorage.removeItem(key);
    });
    alert("Все данные удалены. Перезагрузка.");
    location.reload();
  }

  // Инициализация тарифа
  const rates = Tariff.getForDate(UI.date.local());
  document.getElementById("tariffNight").value = rates.night;
  document.getElementById("tariffAp").value = rates.ap;
  document.getElementById("tariffDate").value = UI.date.local();
</script>
</body>
</html>
