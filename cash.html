<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>🛵 Скутер</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .container { max-width: 480px; margin: 0 auto; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-bottom: 90px; }
    .header { margin-bottom: 12px; }
    .wallet-badge { background: #e8f5e9; color: #2e7d32; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: inline-block; border: 1px solid #43a047; max-width: 100%; }
    
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--panel); padding: 12px; border-radius: 12px; text-align: center; border-left: 3px solid var(--accent); }
    .stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; display: block; }
    .stat-value { font-size: 18px; font-weight: 700; }
    
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
    .action-grid .btn { padding: 14px; font-size: 14px; }

    details.acc { margin-bottom: 12px; }
    details.acc > summary {
      list-style: none; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px; cursor: pointer; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
    }
    details.acc > summary::-webkit-details-marker { display: none; }
    details.acc > summary::after { content: "▼"; font-size: 12px; color: var(--text-dim); }
    details.acc[open] > summary::after { content: "▲"; }
    
    .acc-body {
      background: var(--panel); border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 16px 16px; padding: 16px; margin-top: -4px;
    }
    
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .input-row > div { flex: 1; }
    .input-row label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
    
    .history-list { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
    .history-item { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; color: var(--text-dim); }
    .section-title { font-size: 14px; font-weight: 700; margin: 24px 0 10px; color: var(--text-dim); text-transform: uppercase; }

    .save-btn { width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; background: var(--green); color: white; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; transition: 0.2s; }
    .save-btn:active { background: #2e7d32; transform: scale(0.98); }
    .cancel-btn { width: 100%; padding: 16px; font-size: 16px; border-radius: 12px; background: var(--border); color: var(--text); border: none; font-weight: 700; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🛵 Скутер</h1>
  </div>
  
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">📊 Общий пробег</span>
      <span class="stat-value" id="statKm">0 км</span>
    </div>
    <div class="stat-card" style="border-left-color: var(--orange);">
      <span class="stat-label">⛽ Расход топлива</span>
      <span class="stat-value" id="statConsumption">0 л/100км</span>
    </div>
  </div>

  <div class="action-grid">
    <button class="btn btn-primary" onclick="toggleFuelForm()"><span>⛽</span> Заправка</button>
    <button class="btn btn-green" onclick="toggleMileageForm()"><span>📏</span> Пробег</button>
  </div>

  <!-- Кошельки для скутера -->
  <div class="section-title" style="margin-top: 0;">💰 Мои кошельки для скутера</div>
  <div id="scooterWallets" style="background: var(--panel); border-radius: 16px; padding: 0 16px; border: 1px solid var(--border); margin-bottom: 16px; display: none;"></div>
  <div class="hint" id="noScooterWallets" style="text-align: center; margin-bottom: 16px;">Пока нет оплат с кошельков. Сделай первую заправку или ТО.</div>

  <!-- Форма заправки -->
  <div id="fuelFormContainer" style="display: none; margin-bottom: 20px;">
    <div style="background: var(--panel); border: 2px solid var(--accent); border-radius: 16px; padding: 16px;">
      <h3 style="margin-bottom: 12px; font-size: 16px;">⛽ Новая заправка</h3>
      <div class="input-row">
        <div><label>Сумма по чеку</label><input type="number" id="f_total" class="form-control" placeholder="0" inputmode="decimal"></div>
        <div><label>Цена за литр</label><input type="number" id="f_price" class="form-control" placeholder="0" inputmode="decimal"></div>
      </div>
      <div style="margin-bottom: 12px;"><label>Кошелёк</label><select id="f_wall" class="form-control"></select></div>
      <button class="save-btn" onclick="saveFuel()">💾 СОХРАНИТЬ</button>
      <button class="cancel-btn" onclick="toggleFuelForm()">Отмена</button>
    </div>
  </div>

  <!-- Форма пробега -->
  <div id="mileageFormContainer" style="display: none; margin-bottom: 20px;">
    <div style="background: var(--panel); border: 2px solid var(--green); border-radius: 16px; padding: 16px;">
      <h3 style="margin-bottom: 12px; font-size: 16px;">📏 Обновить пробег</h3>
      <div style="margin-bottom: 12px;"><label>Текущий пробег (км)</label><input type="number" id="m_km" class="form-control" value="" inputmode="numeric"></div>
      <button class="save-btn" onclick="saveMileage()">💾 СОХРАНИТЬ</button>
      <button class="cancel-btn" onclick="toggleMileageForm()">Отмена</button>
    </div>
  </div>

  <div class="section-title">ТО и Расходники</div>
  <div id="componentsList"></div>

  <div class="section-title">Официальные документы</div>
  <div id="officialList"></div>

  <div class="section-title">История</div>
  <div class="history-list" id="globalHistory" style="background: var(--panel); padding: 0 16px; border-radius: 16px; border: 1px solid var(--border);"></div>
</div>

<nav class="tabbar">
  <div class="in">
    <a href="index.html"><span>📦</span>Учёт</a>
    <a href="fin.html"><span>💼</span>Финансы</a>
    <a href="cash.html" class="active"><span>🛵</span>Скутер</a>
    <a href="stats.html"><span>📈</span>Отчёты</a>
    <a href="plan.html"><span>📋</span>План</a>
    <a href="settings.html"><span>⚙</span>Настройки</a>
  </div>
</nav>

<script src="js/lib/storage.js"></script>
<script src="js/lib/ui.js"></script>
<script src="js/lib/notify.js"></script>
<script src="js/lib/guard.js"></script>
<script src="js/lib/theme.js"></script>
<script src="js/domain/state.js"></script>
<script src="js/domain/finance-api.js"></script>
<script>
  Theme.init();
  
  const COMPONENTS = [
    { id: 'oil', title: '🛢 Масло', interval: 2000 },
    { id: 'air_filter', title: '💨 Воздушный фильтр', interval: 3000 },
    { id: 'belt', title: '⚙ Ремень', interval: 10000 },
    { id: 'brakes', title: '🛑 Колодки', interval: 5000 }
  ];
  const OFFICIALS = [
    { id: 'tech', title: '🛠 Техосмотр' },
    { id: 'tax', title: '💰 Налог на дорогу' },
    { id: 'insurance', title: '🛡 Страховка' }
  ];

  // Возвращает HTML для выпадающего списка кошельков (только те, с которых платили за скутер)
  function walletSelectHtml(onlyScooter = false) {
    const wallets = State.getWallets();
    let keys = Object.keys(wallets);
    
    if (onlyScooter) {
      // Ищем уникальные кошельки из операций по скутеру
      const scooterOps = State.getOps().filter(o => o.kind === 'expense' && (o.cat.includes("Скутер") || o.cat.includes("Топливо")));
      const usedWallets = [...new Set(scooterOps.map(o => o.wallet))];
      // Если таких нет, показываем все
      if (usedWallets.length > 0) keys = usedWallets;
    }

    return keys.map(w => `<option value="${UI.esc(w)}">${UI.esc(w)} (${wallets[w] || 0} лей)</option>`).join("");
  }

  function render() {
    const wallets = State.getWallets();

    // Отображение кошельков, связанных со скутером
    const scooterOps = State.getOps().filter(o => o.kind === 'expense' && (o.cat.includes("Скутер") || o.cat.includes("Топливо")));
    const usedWallets = [...new Set(scooterOps.map(o => o.wallet))];
    
    if (usedWallets.length > 0) {
      document.getElementById("scooterWallets").style.display = "block";
      document.getElementById("noScooterWallets").style.display = "none";
      document.getElementById("scooterWallets").innerHTML = usedWallets.map(w => `
        <div class="history-item" style="padding: 12px 0; border-bottom: 1px solid var(--border);">
          <span>${UI.esc(w)}</span>
          <b style="color: var(--green);">${wallets[w] || 0} лей</b>
        </div>
      `).join("");
    } else {
      document.getElementById("scooterWallets").style.display = "none";
      document.getElementById("noScooterWallets").style.display = "block";
    }

    // Заполняем селекты
    document.getElementById("f_wall").innerHTML = walletSelectHtml();

    const scooter = State.getScooter();
    const fuels = State.getFuel();
    const totalKm = Math.max(scooter.currentKm - scooter.startKm, 0);
    document.getElementById("statKm").innerText = totalKm.toFixed(1) + " км";

    const totalLiters = fuels.reduce((s, f) => s + f.liters, 0);
    document.getElementById("statConsumption").innerText = (totalKm > 0 ? (totalLiters / totalKm * 100) : 0).toFixed(2) + " л/100км";

    // Компоненты
    document.getElementById("componentsList").innerHTML = COMPONENTS.map(c => {
      const data = State.getComponent(c.id);
      const nextKm = data.lastKm ? data.lastKm + data.intervalKm : 0;
      const left = nextKm ? nextKm - scooter.currentKm : null;
      let status = "Не задано. Нажми чтобы настроить.";
      if (data.lastKm > 0) {
        if (left <= 0) { status = `⚠️ Пора менять! (просрочено на ${Math.abs(left)} км)`; }
        else { status = `Осталось ${left} км (до ${nextKm})`; }
      }
      const hist = data.history.length ? `<div class="history-list"><b>📜 История замен:</b>${data.history.map(h => `<div class="history-item"><span>${h.date} — ${h.km} км</span><b>${h.cost ? h.cost + ' лей' : ''}</b></div>`).join("")}</div>` : "";
      return `
      <details class="acc">
        <summary><div><div>${c.title}</div><div style="font-size:12px;font-weight:400;color:var(--text-dim);margin-top:4px">${status}</div></div></summary>
        <div class="acc-body">
          <div class="input-row">
            <div><label>Пробег (км)</label><input type="number" id="c_km_${c.id}" class="form-control" value="${scooter.currentKm}"></div>
            <div><label>Интервал (км)</label><input type="number" id="c_int_${c.id}" class="form-control" value="${data.intervalKm || c.interval}"></div>
          </div>
          <div style="margin-bottom: 10px;"><label>Стоимость (лей)</label><input type="number" id="c_cost_${c.id}" class="form-control" placeholder="0"></div>
          <div style="margin-bottom: 10px;"><label>Кошелёк</label><select id="c_wall_${c.id}" class="form-control">${walletSelectHtml()}</select></div>
          <button class="save-btn" onclick="saveComponent('${c.id}', '${c.title}')">💾 ЗАПИСАТЬ ЗАМЕНУ</button>
          ${hist}
        </div>
      </details>`;
    }).join("");

    // Документы
    document.getElementById("officialList").innerHTML = OFFICIALS.map(o => {
      const data = State.getOfficial(o.id);
      let status = data.nextDate ? `Действует до: ${data.nextDate} (${data.cost} лей)` : "Нет данных";
      const hist = data.history.length ? `<div class="history-list"><b>📜 История:</b>${data.history.map(h => `<div class="history-item"><span>${h.date} — до ${h.nextDate}</span><b>${h.cost ? h.cost + ' лей' : ''}</b></div>`).join("")}</div>` : "";
      return `
      <details class="acc">
        <summary><div><div>${o.title}</div><div style="font-size:12px;font-weight:400;color:var(--text-dim);margin-top:4px">${status}</div></div></summary>
        <div class="acc-body">
          <div style="margin-bottom: 10px;"><label>Дата прохождения</label><input type="date" id="o_date_${o.id}" class="form-control" value="${UI.date.local()}"></div>
          <div style="margin-bottom: 10px;"><label>Действует до</label><input type="date" id="o_next_${o.id}" class="form-control" value="${data.nextDate || ""}"></div>
          <div style="margin-bottom: 10px;"><label>Стоимость (лей)</label><input type="number" id="o_cost_${o.id}" class="form-control" placeholder="0"></div>
          <div style="margin-bottom: 10px;"><label>Кошелёк</label><select id="o_wall_${o.id}" class="form-control">${walletSelectHtml()}</select></div>
          <button class="save-btn" onclick="saveOfficial('${o.id}', '${o.title}')">💾 СОХРАНИТЬ</button>
          ${hist}
        </div>
      </details>`;
    }).join("");

    // История
    let historyHtml = "";
    State.getMileageLog().slice().reverse().slice(0, 5).forEach(m => historyHtml += `<div class="history-item"><span>📏 Пробег</span><span>${m.date}: <b>${m.km} км</b></span></div>`);
    fuels.slice().reverse().slice(0, 5).forEach(f => historyHtml += `<div class="history-item"><span>⛽ Заправка</span><span>${f.date}: <b>${f.total} лей</b> (${f.liters.toFixed(2)} л)</span></div>`);
    document.getElementById("globalHistory").innerHTML = historyHtml || `<div class="history-item">Нет записей</div>`;
  }

  function toggleFuelForm() {
    const c = document.getElementById("fuelFormContainer");
    c.style.display = c.style.display === "none" ? "block" : "none";
    if (c.style.display === "block") document.getElementById("f_total").focus();
  }
  function toggleMileageForm() {
    const c = document.getElementById("mileageFormContainer");
    c.style.display = c.style.display === "none" ? "block" : "none";
    if (c.style.display === "block") document.getElementById("m_km").focus();
  }

  function saveFuel() {
    if (!guardAction("saveFuel")) return;
    try {
      const totalCost = UI.num(document.getElementById("f_total").value);
      const price = UI.num(document.getElementById("f_price").value);
      const wallet = document.getElementById("f_wall").value;
      
      if (!wallet) throw new Error("Кошелёк не выбран");
      if (totalCost <= 0 || price <= 0) throw new Error("Заполните сумму и цену");
      
      const liters = UI.r2(totalCost / price);
      
      FinanceAPI.spend({ wallet, amount: totalCost, category: "Топливо (Скутер)", note: `${liters}л` });
      State.setFuel([...State.getFuel(), { date: UI.date.local(), liters, price, total: totalCost }]);
      toggleFuelForm();
      render();
      Notify.show(`✅ ${liters} л. Списано ${totalCost} лей`);
    } catch (e) { Notify.error(e.message); }
  }

  function saveMileage() {
    if (!guardAction("saveMileage")) return;
    try {
      const scooter = State.getScooter();
      const km = UI.num(document.getElementById("m_km").value);
      if (km < scooter.currentKm) throw new Error("Пробег не может уменьшаться");
      
      State.setMileageLog([...State.getMileageLog(), { date: UI.date.local(), km }]);
      scooter.currentKm = km;
      if (scooter.startKm === 0) scooter.startKm = km;
      State.setScooter(scooter);
      toggleMileageForm();
      render();
      Notify.show("✅ Пробег обновлен");
    } catch (e) { Notify.error(e.message); }
  }

  function saveComponent(id, title) {
    if (!guardAction("saveComp")) return;
    try {
      const data = State.getComponent(id);
      const km = UI.num(document.getElementById(`c_km_${id}`).value);
      const interval = UI.num(document.getElementById(`c_int_${id}`).value);
      const cost = UI.num(document.getElementById(`c_cost_${id}`).value);
      const wallet = document.getElementById(`c_wall_${id}`).value;
      
      if (km <= 0 || interval <= 0) throw new Error("Заполните км и интервал");
      if (cost > 0) FinanceAPI.spend({ wallet, amount: cost, category: `Скутер: ${title}`, note: `Замена на ${km} км` });
      
      data.lastKm = km; data.intervalKm = interval; data.lastDate = UI.date.local();
      data.history.push({ date: data.lastDate, km, cost }); State.setComponent(id, data);
      render();
      Notify.show(`✅ Замена ${title} записана`);
    } catch (err) { Notify.error(err.message); }
  }

  function saveOfficial(id, title) {
    if (!guardAction("saveOff")) return;
    try {
      const data = State.getOfficial(id);
      const date = document.getElementById(`o_date_${id}`).value;
      const next = document.getElementById(`o_next_${id}`).value;
      const cost = UI.num(document.getElementById(`o_cost_${id}`).value);
      const wallet = document.getElementById(`o_wall_${id}`).value;
      
      if (!date || !next) throw new Error("Укажите даты");
      if (cost > 0) FinanceAPI.spend({ wallet, amount: cost, category: `Скутер: ${title}`, note: `Оплата до ${next}` });
      
      data.lastDate = date; data.nextDate = next; data.cost = cost;
      data.history.push({ date, nextDate: next, cost });
      State.setOfficial(id, data);
      render();
      Notify.show(`✅ ${title} записан`);
    } catch (err) { Notify.error(err.message); }
  }

  render();
</script>
</body>
</html>
